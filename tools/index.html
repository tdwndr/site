<style>
@font-face{font-family:"Fraunces";font-style:normal;font-weight:300 500;font-display:swap;src:url(/fonts/fraunces-roman.woff2) format("woff2")}
@font-face{font-family:"Fraunces";font-style:italic;font-weight:300 500;font-display:swap;src:url(/fonts/fraunces-italic.woff2) format("woff2")}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:100 900;font-display:swap;src:url(/tools/ds/fonts/geist-mono.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-style:normal;font-weight:500;font-stretch:125%;font-display:swap;src:url(/fonts/archivo-500-wide.woff2) format("woff2")}
/*
  tedw.co.uk/tools: a plain list of things Ted has built.
  Same tokens and type as the main site, dialled down: one column, text only.
  To add something, copy an <li class="tool"> block below. Newest first.
*/
:root {
  --paper: #FEFCF6;
  --ink: #0E1B3D;
  --text: #4A5064;      /* body copy: lighter than ink */
  --muted: #8E93A3;     /* dates, labels */
  --faint: #B9BCC6;     /* separators */
  --rule: #EEEADF;
  --accent: #1A33F5;

  --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: "Archivo", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--text);
  font: 300 1.075rem/1.7 var(--serif);
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.page {
  display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh;
  max-width: 36rem;
  margin: 0 auto;
  padding: clamp(2.5rem, 8vw, 5.5rem) 1.5rem calc(4rem + env(safe-area-inset-bottom, 0px));
}
a {
  color: var(--ink);
  text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent);
  text-decoration-thickness: 1px;
  text-underline-offset: .22em;
}
a:hover { color: var(--accent); text-decoration-color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.caps {
  font-family: var(--sans);
  font-weight: 500;
  font-stretch: 125%;
  font-variation-settings: "wdth" 125;
  text-transform: uppercase;
  letter-spacing: .12em;
}

/* Masthead */
.mast { display: flex; align-items: baseline; gap: .6em; font-size: .8rem; }
.mast a { text-decoration: none; color: var(--ink); }
.mast a:hover { color: var(--accent); }
.mast__sep { color: var(--faint); }
.mast__here { color: var(--muted); }

.intro { margin: clamp(2.5rem, 6vw, 3.5rem) 0 0; }
.intro h1 {
  margin: 0 0 .9rem;
  color: var(--ink);
  font-weight: 300;
  font-size: clamp(1.9rem, 1.4rem + 2vw, 2.5rem);
  line-height: 1.15;
  letter-spacing: -.02em;
}
.intro p { margin: 0; max-width: 32rem; }


/* Prompt row: path, blinking cursor, last updated */
.prompt { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin: clamp(2.5rem, 6vw, 3.5rem) 0 0; padding-bottom: .9rem; border-bottom: 1px solid var(--rule); font-family: var(--mono); font-size: .8rem; line-height: 1.6; }
.path { color: var(--muted); white-space: nowrap; }
.typed { color: var(--accent); }
.caret { display: inline-block; width: .55em; height: 1.05em; margin-left: .12em; vertical-align: -.17em; background: var(--accent); }
.updated { color: var(--faint); font-size: .7rem; white-space: nowrap; }
.updated time { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .caret { animation: blink 1.1s steps(1) infinite; }
  .typing .caret, .go .caret { animation: none; }
  .go .caret { animation: blink .12s steps(1) 2; }
  .tools a.name { transition: transform .18s cubic-bezier(.2, .7, .2, 1); }
  .tools .desc { transition: color .18s; }
}
@keyframes blink { 50% { opacity: 0; } }
@media (max-width: 560px) { .updated { display: none; } }

/* The list: reads like a directory listing */
.tools { list-style: none; margin: 1.1rem 0 0; padding: 0; font-family: var(--mono); font-size: .9rem; line-height: 1.6; }
.tools { display: grid; grid-template-columns: max-content 1fr; column-gap: 2rem; }
.tools li { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; align-items: baseline; padding: .45rem 0; }
@media (max-width: 560px) { .tools { grid-template-columns: 1fr; } .tools .desc { margin-top: .1rem; } }
.tools .name { text-decoration: none; }
.tools a.name { color: var(--accent); }
.tools a.name:hover, .tools a.name:focus-visible { text-decoration: underline; text-underline-offset: .25em; outline: none; }
.tools a.name:focus-visible { transform: translateX(3px); }
.tools li:has(a.name:focus-visible) .desc, .tools li:has(a.name:hover) .desc { color: var(--text); }
.tools .desc { color: var(--muted); font-size: .8rem; }
.tools .unlinked .name { color: var(--muted); }
.tools .empty { color: var(--muted); }
.foot { margin-top: auto; padding-top: clamp(4rem, 10vw, 6rem); font-size: .58rem; color: var(--muted); text-align: center; }
</style>

<body>
<div class="page">

  <header class="mast caps">
    <a href="/">Ted Winder</a><span class="mast__sep" aria-hidden="true">/</span><span class="mast__here">Tools</span>
  </header>

  <main>
    <div class="intro">
      <h1>Things I’ve built</h1>
      <p>Small tools and experiments I’ve made.</p>
    </div>

    <!-- tools:start updated=2026-11-13 (generated by tools/build.py: do not edit by hand) -->
    <p class="prompt"><span class="path" aria-hidden="true">/tools/<span class="typed" id="typed"></span><span class="caret"></span></span><span class="updated">updated <time datetime="2026-11-13">13 Nov 2026</time></span></p>
    <ul class="tools">
      <li class="unlinked"><span class="name"><span class="slash" aria-hidden="true">/</span>ds</span><span class="desc">My design system: tokens, type and principles.</span></li>
      <li><a class="name" href="/tools/run/"><span class="slash" aria-hidden="true">/</span>run</a><span class="desc">A personal training plan for your next race.</span></li>
    </ul>
    <!-- tools:end -->
  </main>

  <footer class="foot caps">© Ted Winder 2026</footer>

</div>
<script>
/* Keyboard: j/k or arrows move between tools, Enter opens, Esc clears.
   Selection is just focus on the link, so Tab and the mouse work the same way.
   The prompt above the list types out the name of whatever is selected. */
(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll(".tools a.name"));
  var typed = document.getElementById("typed");
  var prompt = document.querySelector(".prompt");
  if (!links.length || !typed) return;
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var timer;

  function type(text) {
    clearInterval(timer);
    prompt.classList.remove("typing");
    if (calm || !text) { typed.textContent = text; return; }
    var i = 0; typed.textContent = ""; prompt.classList.add("typing");
    timer = setInterval(function () {
      typed.textContent = text.slice(0, ++i);
      if (i >= text.length) { clearInterval(timer); prompt.classList.remove("typing"); }
    }, 38);
  }

  links.forEach(function (a) {
    a.addEventListener("focus", function () { type(a.textContent.replace(/^\//, "")); });
    a.addEventListener("blur", function () { setTimeout(function () {
      if (!document.activeElement || !document.activeElement.matches(".tools a.name")) type("");
    }, 0); });
    a.addEventListener("mouseenter", function () { a.focus({ preventScroll: true }); });
    a.addEventListener("click", function (e) {
      if (calm || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
      e.preventDefault(); prompt.classList.add("go");
      setTimeout(function () { location.href = a.href; }, 260);
    });
  });
  document.querySelector(".tools").addEventListener("mouseleave", function () {
    if (document.activeElement && document.activeElement.matches(".tools a.name")) document.activeElement.blur();
  });

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var i = links.indexOf(document.activeElement), n = links.length, to;
    if (e.key === "j" || e.key === "ArrowDown") to = i < 0 ? 0 : (i + 1) % n;
    else if (e.key === "k" || e.key === "ArrowUp") to = i < 0 ? n - 1 : (i - 1 + n) % n;
    else if (e.key === "Home") to = 0;
    else if (e.key === "End") to = n - 1;
    else if (e.key === "Escape" && i >= 0) { links[i].blur(); return; }
    else return;
    e.preventDefault(); links[to].focus();
  });
})();
</script>
</body>

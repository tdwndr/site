/*
  Run plan: tedw.co.uk/run/
  A mobile-first web app. Figtree for the interface, wide Archivo caps for the
  brand and small labels.
  Conventions:
  - Colours, radii and fonts come from the tokens below (light + dark).
  - Run types set --c with a k-* class; tiles, ticks and accents read it.
  - Focus rings follow each element's own rounded corners (outline, never an
    inset shadow inside a clipped card).
  - Every tap target is at least 44px. Motion respects reduced-motion.
  Sections: 1 tokens  2 base  3 icons & tiles  4 buttons  5 cards & lists
            6 forms & controls  7 intro  8 setup  9 app shell  10 today
            11 plan & chart  12 learn  13 sheets & toast  14 charm & motion
*/

/* 1. TOKENS ---------------------------------------------------------------- */
:root {
  --bg: #F4F5F9;
  --surface: #FFFFFF;
  --surface-2: #F6F7FA;
  --fill: rgba(110, 116, 140, .1);
  --fill-2: rgba(110, 116, 140, .2);
  --ink: #10142A;
  --ink-2: #585E75;
  --ink-3: #9297AB;
  --line: rgba(16, 20, 42, .08);
  --line-2: rgba(16, 20, 42, .16);
  --accent: #2E4BFF;
  --accent-2: #1C2FCB;
  --accent-soft: color-mix(in srgb, var(--accent) 10%, var(--surface));
  --grad-a: #4A66FF;
  --grad-b: #1E2FD6;
  --toast: #14172A;
  --toast-ink: #FFFFFF;

  --good: #17A658;
  --warn: #E8930A;
  --bad: #E5294E;
  --c-easy: #17A658;
  --c-long: #2E6BFF;
  --c-speed: #EC3F72;
  --c-tempo: #F08A12;
  --c-parkrun: #0AA19E;
  --c-race: #7B3FF2;
  --c-rest: #8A8FA3;
  --c-line: #E0700A;
  /* Training phases, in order. Validated for colour-blind separation; always shown with a text label too */
  --ph-foundation: #8A8FA3;
  --ph-base: #0AA19E;
  --ph-build: #E8930A;
  --ph-peak: #D6336C;
  --ph-taper: #5B5BF0;

  --r-xl: 24px;
  --r-lg: 18px;
  --r-md: 14px;
  --sh-1: 0 1px 2px rgba(16, 20, 42, .04), 0 4px 16px -8px rgba(16, 20, 42, .12);
  --sh-2: 0 -10px 40px -12px rgba(16, 20, 42, .3);

  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --brand: "Archivo", "Figtree", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --col: 720px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B0C11;
    --surface: #16181F;
    --surface-2: #1E2129;
    --fill: rgba(140, 146, 170, .14);
    --fill-2: rgba(140, 146, 170, .26);
    --ink: #F1F2F7;
    --ink-2: #A6ABBD;
    --ink-3: #6E7387;
    --line: rgba(255, 255, 255, .08);
    --line-2: rgba(255, 255, 255, .16);
    --accent: #7088FF;
    --accent-2: #4F68F5;
    --grad-a: #3F57F0;
    --grad-b: #1A27A8;
    --toast: #F1F2F7;
    --toast-ink: #10142A;
    --c-long: #5B8CFF;
    --c-race: #9C6BFF;
    --c-line: #D8721C;
    --ph-base: #0B9C99;
    --ph-build: #C77F0A;
    --ph-peak: #D6336C;
    --ph-taper: #6E6EF5;
    --sh-1: none;
  }
}

/* 2. BASE ------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; background: var(--bg); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--ink);
  font: 400 17px/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
[hidden] { display: none !important; }
b, strong { font-weight: 650; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.brand {
  font: 500 13px/1 var(--brand); font-stretch: 125%; font-variation-settings: "wdth" 125;
  letter-spacing: .14em; text-transform: uppercase; text-decoration: none; color: inherit; white-space: nowrap;
}
.eyebrow {
  font: 500 11.5px/1.4 var(--brand); font-stretch: 125%; font-variation-settings: "wdth" 125;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2);
}
.nojs { padding: 3rem 1.5rem; text-align: center; }

/* An explained word: tap for a short definition */
.term {
  display: inline; padding: 0; margin: 0; border: 0; background: none; cursor: pointer;
  font: inherit; font-weight: 650; color: var(--accent); white-space: nowrap; letter-spacing: inherit; text-transform: inherit; text-align: inherit;
  text-decoration: none; border-radius: 4px;
}
.term__i { display: inline-block; width: .95em; height: .95em; margin-left: .22em; vertical-align: -.12em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; transition: transform .2s var(--ease); }
@media (hover: hover) { .term:hover { color: var(--accent-2); } .term:hover .term__i { transform: scale(1.15); } }

/* 3. ICONS & TILES ----------------------------------------------------------- */
.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.k-easy { --c: var(--c-easy); }
.k-long { --c: var(--c-long); }
.k-speed { --c: var(--c-speed); }
.k-tempo { --c: var(--c-tempo); }
.k-parkrun { --c: var(--c-parkrun); }
.k-race { --c: var(--c-race); }
.k-rest { --c: var(--c-rest); }
.k-accent { --c: var(--accent); }
.k-good { --c: var(--good); }
.k-warn { --c: var(--warn); }
.k-bad { --c: var(--bad); }
.p-foundation { --c: var(--ph-foundation); }
.p-base { --c: var(--ph-base); }
.p-build { --c: var(--ph-build); }
.p-peak { --c: var(--ph-peak); }
.p-taper { --c: var(--ph-taper); }
.tile {
  flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px;
  background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--surface)); color: var(--c, var(--accent));
}
.tile .ic { width: 21px; height: 21px; }
.tile--lg { width: 52px; height: 52px; border-radius: 15px; }
.tile--lg .ic { width: 27px; height: 27px; }
.tile--solid { background: var(--c); color: #fff; }
.tile--txt { width: 48px; font: 700 14px/1 var(--ui); }
.tag {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px;
  font: 650 13px/1.25 var(--ui); background: color-mix(in srgb, var(--c, var(--accent)) 13%, var(--surface)); color: var(--c, var(--accent));
}
.tag .ic { width: 15px; height: 15px; }
.badge {
  display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px;
  font: 700 11px/1.15 var(--ui); letter-spacing: .04em; text-transform: uppercase;
  background: var(--accent); color: #fff;
}
.badge--soft { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); color: color-mix(in srgb, var(--warn) 70%, var(--ink)); }

/* 4. BUTTONS ------------------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 22px; border: 0; border-radius: 14px;
  font: 650 16.5px/1.1 var(--ui); text-decoration: none; text-align: center; white-space: nowrap;
  transition: transform .15s var(--ease), background-color .25s, color .25s, box-shadow .2s;
}
.btn:active { transform: scale(.98); }
.btn .ic { width: 20px; height: 20px; stroke-width: 2.3; }
.btn--primary { background: var(--accent); color: #fff; box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--accent) 80%, transparent); }
.btn--secondary { background: var(--accent-soft); color: var(--accent); }
.btn--ghost { background: transparent; color: var(--ink-2); border: 1.5px solid var(--line-2); }
.btn--done { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good); }
.btn--light { background: #fff; color: #1C2FCB; }
.btn--block { width: 100%; }
.btn--sm { min-height: 44px; font-size: 15px; padding: 0 16px; border-radius: 12px; }
@media (hover: hover) {
  .btn--primary:hover { background: var(--accent-2); }
  .btn--secondary:hover { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
  .btn--ghost:hover { border-color: var(--ink-3); color: var(--ink); }
}
.icon-btn {
  flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
  background: var(--fill); color: var(--ink-2); transition: background-color .2s, transform .15s var(--ease);
}
.icon-btn .ic { width: 18px; height: 18px; stroke-width: 2.4; }
.icon-btn:active { transform: scale(.92); }
@media (hover: hover) { .icon-btn:hover { background: var(--fill-2); color: var(--ink); } }
.link { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--accent); font: 600 15px/1 var(--ui); border-radius: 8px; }
.link .ic { width: 16px; height: 16px; stroke-width: 2.4; }
.link--inline { display: inline; min-height: 0; padding: 12px 4px; margin: -12px -4px; font: inherit; font-weight: 650; vertical-align: baseline; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }

/* 5. CARDS & LISTS ------------------------------------------------------------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-1); }
.card + .card { margin-top: 14px; }
.pad { padding: 22px; }
.group-label { margin: 32px 4px 12px; }
.list { padding: 6px; }
/* A row inside a card: rounded so hover and focus follow its corners */
.row {
  position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 14px;
  border: 0; border-radius: 14px; background: none; text-align: left; color: inherit; text-decoration: none;
}
.row + .row::before, .cell + .cell::before { content: ""; position: absolute; top: 0; left: 70px; right: 14px; height: 1px; background: var(--line); }
.row__label { flex: 1; min-width: 0; font-weight: 550; }
.row__label small { display: block; margin-top: 2px; font-size: 14.5px; font-weight: 400; line-height: 1.4; color: var(--ink-2); }
.row__value { color: var(--ink-2); font-size: 15px; font-weight: 600; white-space: nowrap; text-align: right; }
.row__value small { font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
.row .chev { width: 16px; height: 16px; color: var(--ink-3); stroke-width: 2.6; }
.row--nav { cursor: pointer; transition: background-color .2s; }
.row--nav:active { background: var(--fill); }
@media (hover: hover) { .row--nav:hover { background: var(--fill); } }
.row--danger { color: var(--bad); }
.hint { margin: 10px 4px 0; font-size: 14.5px; line-height: 1.45; color: var(--ink-2); }
.err { margin: 8px 4px 0; font-size: 14.5px; line-height: 1.4; color: var(--bad); font-weight: 550; }
.callout {
  display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; padding: 14px 16px; border-radius: var(--r-md);
  background: color-mix(in srgb, var(--c, var(--accent)) 10%, var(--surface)); font-size: 15.5px; line-height: 1.5;
}
.callout > .ic { color: var(--c, var(--accent)); width: 20px; height: 20px; margin-top: 2px; }
.callout b { display: block; margin-bottom: 1px; }

/* A run in a list: icon, title and details, with a tick on the right */
.cell { position: relative; display: flex; align-items: center; gap: 4px; border-radius: 14px; transition: background-color .2s; }
.cell__main {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; min-height: 76px;
  padding: 14px 6px 14px 14px; background: none; border: 0; border-radius: 14px; text-align: left;
}
.cell__main:active { background: var(--fill); }
@media (hover: hover) { .cell:hover { background: var(--fill); } .cell:hover + .cell::before, .cell:hover::before { opacity: 0; } }
.cell__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.cell__chev { width: 18px; height: 18px; margin: 0 2px 0 4px; color: var(--ink-3); stroke-width: 2.4; transition: transform .2s var(--ease), color .2s; }
@media (hover: hover) { .cell:hover .cell__chev { color: var(--accent); transform: translateX(2px); } }
.cell__main:active .cell__chev { color: var(--accent); }
.cell__title { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-weight: 650; font-size: 16.5px; line-height: 1.25; }
.cell__sub { font-size: 14.5px; color: var(--ink-2); line-height: 1.4; }
.cell__flag { display: inline-flex; color: var(--ink-2); }
.cell__flag .ic { width: 16px; height: 16px; }
.cell.is-done .cell__title { color: var(--ink-2); }
.cell.is-missed .tile { filter: grayscale(1); opacity: .55; }
.cell.is-today { background: var(--accent-soft); }
.cell.is-today::before, .cell.is-today + .cell::before { opacity: 0; }
.empty { padding: 18px; color: var(--ink-2); font-size: 15px; }

/* Tick: a 52px tap zone around a 30px circle that never shrinks */
.check { flex: 0 0 52px; display: grid; place-items: center; width: 52px; min-width: 52px; height: 60px; padding: 0; border: 0; background: none; border-radius: 50%; position: relative; }
.check__c {
  display: grid; place-items: center; width: 30px; height: 30px; min-width: 30px; border-radius: 50%; flex: none;
  border: 2px solid var(--ink-3); transition: background-color .2s, border-color .2s, transform .15s var(--ease);
}
.check__c .ic { width: 16px; height: 16px; stroke-width: 3.2; color: #fff; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .3s var(--ease); }
.check[aria-pressed="true"] .check__c { background: var(--good); border-color: var(--good); }
.check[aria-pressed="true"] .check__c .ic { opacity: 1; transform: none; }
.check:active .check__c { transform: scale(.88); }
@media (hover: hover) { .check:hover .check__c { border-color: var(--good); } }

/* 6. FORMS & CONTROLS --------------------------------------------------------- */
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field + .field { margin-top: 18px; }
.field__label { font-weight: 650; font-size: 15.5px; }
.field__label small { font-weight: 450; color: var(--ink-2); }
.input-wrap { position: relative; }
.input-wrap > .ic { position: absolute; left: 15px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--ink-3); pointer-events: none; transition: color .2s; }
.input {
  display: block; width: 100%; min-height: 54px; padding: 13px 15px; margin: 0;
  font: 450 17px/1.3 var(--ui); color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line-2); border-radius: 14px; outline: none;
  -webkit-appearance: none; appearance: none; transition: border-color .2s, box-shadow .2s;
}
.input-wrap > .ic + .input { padding-left: 46px; }
.input::placeholder { color: var(--ink-3); }
@media (hover: hover) { .input:hover { border-color: var(--ink-3); } }
.input:focus, .input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); outline: none; }
.input-wrap:focus-within > .ic { color: var(--accent); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.input--time { text-align: center; font-weight: 600; letter-spacing: .02em; padding-inline: 8px; }
input[type="date"].input { min-height: 54px; line-height: 26px; }
input[type="date"].input::-webkit-date-and-time-value { text-align: left; }
.pbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pbs .field + .field { margin-top: 0; }
.pbs .field__label { font-size: 14.5px; text-align: center; }

/* Segmented choice */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.seg span {
  display: grid; place-items: center; min-height: 50px; padding: 0 6px; border-radius: 12px;
  border: 1.5px solid var(--line-2); background: var(--surface); font: 650 17px/1 var(--ui); color: var(--ink);
  transition: background-color .2s, border-color .2s, color .2s, transform .15s var(--ease);
}
.seg label:active span { transform: scale(.96); }
@media (hover: hover) { .seg label:hover span { border-color: var(--ink-3); } }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
.seg input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.seg--sm span { min-height: 40px; font-size: 15px; }

/* Switch */
.sw { position: relative; flex: none; width: 48px; height: 28px; }
.sw input { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw__t { position: absolute; inset: 0; border-radius: 28px; background: var(--fill-2); transition: background-color .25s; }
.sw__t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); transition: translate .28s var(--ease); }
.sw input:checked + .sw__t { background: var(--accent); }
.sw input:checked + .sw__t::after { translate: 20px 0; }
.sw input:focus-visible + .sw__t { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbox { position: relative; }
.chipbox input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.chipbox span { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface); font: 550 15px/1 var(--ui); transition: background-color .2s, color .2s, border-color .2s; }
.chipbox span .ic { width: 16px; height: 16px; stroke-width: 3; display: none; }
.chipbox input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
.chipbox input:checked + span .ic { display: block; }
.chipbox input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

/* Slider */
.slider { display: flex; flex-direction: column; gap: 8px; }
.slider__top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.slider__label { font-weight: 650; font-size: 16px; }
.slider__value { font: 750 22px/1 var(--ui); color: var(--accent); }
.slider__row { display: flex; align-items: center; gap: 10px; }
.slider__ends { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--ink-3); }
.range {
  --p: 50%;
  flex: 1; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer;
  -webkit-appearance: none; appearance: none; touch-action: pan-y; border-radius: 22px;
}
.range::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) var(--p), var(--fill-2) var(--p)); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }
.range::-moz-range-track { height: 8px; border-radius: 4px; background: var(--fill-2); }
.range::-moz-range-progress { height: 8px; border-radius: 4px; background: var(--accent); }
.range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }
.range:focus-visible { outline: none; }
.range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); }
.range:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); }

/* 7. INTRO -------------------------------------------------------------------- */
.intro {
  position: relative; overflow: hidden; min-height: 100vh; min-height: 100dvh; color: #fff;
  background: radial-gradient(120% 60% at 85% 0%, rgba(255, 255, 255, .18), transparent 60%), linear-gradient(165deg, var(--grad-a), var(--grad-b) 70%);
  display: flex; flex-direction: column;
}
.intro__in { position: relative; z-index: 1; flex: 1; width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 22px) 24px calc(env(safe-area-inset-bottom) + 24px); }
.intro__top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.intro__top a { color: rgba(255, 255, 255, .8); text-decoration: none; font-size: 15px; padding: 10px 0; }
.intro__top a:hover { color: #fff; text-decoration: underline; }
.preview { position: relative; height: 236px; margin: 22px 0 10px; }
.preview__card {
  position: absolute; display: flex; align-items: center; gap: 14px; width: 74%; padding: 14px 16px; border-radius: 18px;
  background: rgba(255, 255, 255, .97); color: #10142A; box-shadow: 0 18px 40px -18px rgba(5, 10, 60, .7);
}
.preview__card b { display: block; font-size: 16.5px; white-space: nowrap; }
.preview__card span { font-size: 14px; color: #585E75; white-space: nowrap; }
.preview__card .tile { background: color-mix(in srgb, var(--c) 14%, #fff); }
.preview__card .check__c { margin-left: auto; border-color: #9297AB; }
.preview__card:nth-child(1) { top: 0; left: 0; rotate: -4deg; }
.preview__card:nth-child(2) { top: 80px; right: 0; rotate: 3deg; }
.preview__card:nth-child(3) { top: 160px; left: 6%; rotate: -1.5deg; }
.preview__card:nth-child(2) .check__c { background: #17A658; border-color: #17A658; }
.preview__card:nth-child(2) .check__c .ic { opacity: 1; transform: none; }
.intro h1 { margin-top: 20px; font: 750 40px/1.06 var(--ui); letter-spacing: -.025em; text-wrap: balance; }
.intro__lede { margin-top: 14px; font-size: 18.5px; line-height: 1.5; color: rgba(255, 255, 255, .88); }
.feats { display: grid; gap: 16px; margin: 28px 0 32px; }
.feats li { display: flex; align-items: center; gap: 14px; font-size: 16.5px; line-height: 1.4; }
.feats .tile { background: rgba(255, 255, 255, .16); color: #fff; }
.intro__cta { margin-top: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.intro__cta .btn { max-width: 420px; }
.intro__fine { font-size: 14px; color: rgba(255, 255, 255, .78); }

/* 8. SETUP -------------------------------------------------------------------- */
.nav { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 94%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.nav__in { display: flex; align-items: center; gap: 14px; max-width: 600px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 10px) 20px 10px; }
.nav__bar { flex: 1; height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.nav__bar span { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .45s var(--ease); }
.nav__count { min-width: 44px; text-align: center; font: 650 14px/1 var(--ui); color: var(--ink-2); }
.setup__body { max-width: 600px; margin: 0 auto; padding: 8px 20px calc(env(safe-area-inset-bottom) + 120px); }
.step { border: 0; margin: 0; padding: 0; min-width: 0; }
.step__head { padding: 22px 4px 24px; float: left; width: 100%; }
.step__head + * { clear: both; }
.step__title { margin-top: 8px; font: 750 30px/1.15 var(--ui); letter-spacing: -.02em; text-wrap: balance; }
.step__lede { margin-top: 10px; font-size: 17px; line-height: 1.5; color: var(--ink-2); }
.setup__foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 20px 20px calc(env(safe-area-inset-bottom) + 16px); background: linear-gradient(to bottom, transparent, var(--bg) 38%); }
.setup__foot .btn { display: flex; max-width: 560px; margin: 0 auto; }

.dist { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dist label { position: relative; border-radius: 18px; }
.dist input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.dist__box {
  position: relative; display: flex; flex-direction: column; gap: 12px; height: 100%; min-height: 128px; padding: 16px;
  border-radius: 18px; background: var(--surface); border: 1.5px solid var(--line-2);
  transition: border-color .2s, box-shadow .2s, transform .15s var(--ease);
}
@media (hover: hover) { .dist label:hover .dist__box { border-color: var(--ink-3); } }
.dist label:active .dist__box { transform: scale(.98); }
.dist__name { font: 700 18px/1.2 var(--ui); }
.dist__sub { font-size: 14px; color: var(--ink-2); }
.dist__tick { position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; transition: background-color .2s, border-color .2s; }
.dist__tick .ic { width: 14px; height: 14px; stroke-width: 3.4; color: #fff; opacity: 0; }
.dist input:checked + .dist__box { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.dist input:checked + .dist__box .dist__tick { background: var(--accent); border-color: var(--accent); }
.dist input:checked + .dist__box .dist__tick .ic { opacity: 1; }
.dist input:focus-visible + .dist__box { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; }
.opt { display: flex; align-items: center; gap: 14px; padding: 18px 20px; }
.opt + .opt, .opt + .opt-more { border-top: 1px solid var(--line); }
.opt__text { flex: 1; min-width: 0; font-weight: 600; }
.opt__text small { display: block; margin-top: 2px; font-weight: 400; font-size: 14.5px; line-height: 1.45; color: var(--ink-2); }
.opt-more { padding: 16px 20px 20px; }
.goal { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26px 22px 18px; }
.goal__time { margin-top: 8px; font: 800 60px/1 var(--ui); letter-spacing: -.03em; }
.goal__pace { margin-top: 8px; font-size: 15.5px; color: var(--ink-2); }
.goal .slider { width: 100%; margin-top: 18px; }
.verdict { display: flex; gap: 14px; align-items: flex-start; }
.verdict p { margin-top: 8px; font-size: 16px; line-height: 1.5; }

/* 9. APP SHELL ---------------------------------------------------------------- */
.top {
  position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.top__in { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "brand count" "tabs tabs"; align-items: center; column-gap: 12px; max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.top .brand { grid-area: brand; padding: 16px 4px 4px; }
.count { grid-area: count; justify-self: end; margin-top: 10px; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 700 14px/1 var(--ui); white-space: nowrap; }
.count .ic { width: 16px; height: 16px; stroke-width: 2.4; }
.tabs { grid-area: tabs; display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 6px; }
.tab {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 52px; padding: 0 8px;
  border: 0; background: none; color: var(--ink-2); font: 650 15px/1 var(--ui); border-radius: 12px 12px 0 0; transition: color .2s;
}
.tab .ic { width: 19px; height: 19px; }
.tab::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); transform: scaleX(0); transition: transform .3s var(--ease); }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"]::after { transform: none; }
@media (hover: hover) { .tab:hover { color: var(--ink); } .tab[aria-current="page"]:hover { color: var(--accent); } }
@media (max-width: 380px) { .tab .ic { display: none; } }
@media (min-width: 760px) {
  .top__in { grid-template-columns: auto 1fr auto; grid-template-areas: "brand tabs count"; padding: 0 24px; }
  .top .brand { padding: 0; }
  .count { margin-top: 0; }
  .tabs { display: flex; justify-content: center; gap: 6px; margin-top: 0; }
  .tab { min-height: 64px; padding: 0 16px; }
}
.page { max-width: var(--col); margin: 0 auto; padding: 28px 20px calc(env(safe-area-inset-bottom) + 64px); }
.page--wide { max-width: 1080px; }
.head { padding: 0 4px 22px; }
.h1 { margin-top: 6px; font: 750 30px/1.15 var(--ui); letter-spacing: -.02em; }
.head__sub { margin-top: 8px; font-size: 16px; line-height: 1.5; color: var(--ink-2); }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 36px 4px 14px; font: 700 20px/1.25 var(--ui); letter-spacing: -.01em; }
.sec-h .eyebrow { font-size: 11px; }
.sec-sub { margin: -8px 4px 14px; font-size: 15px; color: var(--ink-2); }
.footnote { margin: 28px 6px 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-3); }
.footnote a { color: var(--ink-2); }
.sign-off { margin-top: 40px; text-align: center; font-size: 13.5px; color: var(--ink-3); }
.sign-off .ic { width: 15px; height: 15px; vertical-align: -2px; color: var(--c-speed); }
@media (min-width: 960px) {
  .today-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 0 32px; align-items: start; }
  .today-grid > .col > .sec-h:first-child { margin-top: 0; }
}

/* 10. TODAY ------------------------------------------------------------------- */
.race-card {
  position: relative; overflow: hidden; padding: 22px; border-radius: var(--r-xl); color: #fff;
  background: radial-gradient(90% 80% at 100% 0%, rgba(255, 255, 255, .2), transparent 55%), linear-gradient(150deg, var(--grad-a), var(--grad-b));
  box-shadow: 0 16px 34px -18px color-mix(in srgb, var(--grad-b) 85%, transparent);
}
.race-card__top { display: flex; align-items: center; gap: 14px; }
.race-card__top .tile { background: rgba(255, 255, 255, .18); color: #fff; }
.race-card__name { font: 700 19px/1.25 var(--ui); }
.race-card__meta { margin-top: 2px; font-size: 14.5px; color: rgba(255, 255, 255, .84); }
.race-card__mid { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: 22px; }
.race-card__days b { display: block; font: 800 62px/.9 var(--ui); letter-spacing: -.03em; }
.race-card__days span { display: block; margin-top: 8px; font-size: 15px; color: rgba(255, 255, 255, .88); }
.streak { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(255, 255, 255, .16); font: 650 14px/1 var(--ui); white-space: nowrap; }
.streak .ic { width: 16px; height: 16px; color: #FFC774; }
/* The road to race day: a track with a runner on it and a flag at the end */
.road { position: relative; margin: 26px 0 0; padding: 0 14px 0 0; }
.road__track { position: relative; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, .2); }
.road__fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: #fff; width: var(--p); transition: width .8s var(--ease); }
.road__me { position: absolute; top: 50%; left: var(--p); translate: -50% -50%; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--grad-b); box-shadow: 0 4px 12px rgba(5, 10, 60, .35); transition: left .8s var(--ease); }
.road__me .ic { width: 17px; height: 17px; stroke-width: 2.4; }
.road__flag { position: absolute; right: -2px; top: 50%; translate: 0 -78%; color: #fff; }
.road__flag .ic { width: 22px; height: 22px; }
.road__labels { display: flex; justify-content: space-between; margin-top: 12px; font-size: 13.5px; color: rgba(255, 255, 255, .86); }
.road__labels b { color: #fff; }
.race-card__foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.mini { padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, .13); }
.mini b { display: block; font: 750 19px/1.15 var(--ui); }
.mini span { font-size: 13px; color: rgba(255, 255, 255, .84); }

.run-card { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 22px; border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-1); }
.run-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 120px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 13%, transparent), transparent); pointer-events: none; }
.run-card > * { position: relative; }
.run-card__head { display: flex; align-items: center; gap: 14px; }
.run-card__kicker { font: 700 12.5px/1.3 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.run-card__title { margin-top: 3px; font: 750 27px/1.12 var(--ui); letter-spacing: -.02em; }
.run-card__purpose { font-size: 16.5px; line-height: 1.55; }
.run-card__actions { display: grid; grid-template-columns: 1fr 1.7fr; gap: 12px; }
.cheer { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-md); background: var(--accent-soft); font-size: 16px; line-height: 1.45; }
.cheer .ic { color: var(--accent); width: 20px; height: 20px; margin-top: 1px; }
.stats3 { display: grid; grid-template-columns: 1fr 1fr 1.45fr; gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); }
.stat .ic { width: 18px; height: 18px; color: var(--c, var(--accent)); }
.stat b { font: 750 20px/1.15 var(--ui); white-space: nowrap; }
.stat b small { margin-left: 2px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.stat > span { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 380px) { .stats3 { grid-template-columns: 1fr 1fr; } .stat:last-child { grid-column: 1 / -1; } .run-card__actions { grid-template-columns: 1fr; } }
.rest-card { display: flex; gap: 16px; align-items: center; padding: 20px 22px; }
.rest-card b { display: block; font-size: 17px; }
.rest-card p { font-size: 15.5px; line-height: 1.45; color: var(--ink-2); }
.moon { position: relative; }
.moon i { position: absolute; font: 700 11px/1 var(--ui); font-style: normal; color: var(--c-rest); }
.moon i:nth-of-type(1) { top: -4px; right: -6px; }
.moon i:nth-of-type(2) { top: -12px; right: -14px; font-size: 9px; }
.done-card .run-card__title { font-size: 23px; }
.upnext { border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); padding: 4px; }
.tip { display: flex; gap: 14px; align-items: flex-start; padding: 20px 22px; }
.tip p { font-size: 15.5px; line-height: 1.5; color: var(--ink-2); }
.tip b { display: block; color: var(--ink); margin-bottom: 2px; }

/* 11. PLAN & CHART ------------------------------------------------------------- */
.weeks { margin-top: 18px; }
.week { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-1); scroll-margin-top: 140px; }
.week + .week { margin-top: 12px; }
.week.is-now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--sh-1); }
.week__head { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 16px 18px; border: 0; background: none; text-align: left; border-radius: var(--r-lg); transition: background-color .2s; }
.week.is-open .week__head { border-radius: var(--r-lg) var(--r-lg) 0 0; }
.week__head:active { background: var(--fill); }
@media (hover: hover) { .week__head:hover { background: var(--fill); } }
.week__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.week__title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 700 17.5px/1.25 var(--ui); }
.week__sub { font-size: 14.5px; color: var(--ink-2); }
.week__chev { color: var(--ink-3); width: 18px; height: 18px; stroke-width: 2.6; transition: rotate .3s var(--ease); }
.week.is-open .week__chev { rotate: 180deg; }
.week__body { border-top: 1px solid var(--line); padding: 6px; }
.week__body .callout { margin: 8px 8px 6px; font-size: 15px; }
.mring { position: relative; flex: none; display: grid; place-items: center; width: 44px; height: 44px; font: 700 12px/1 var(--ui); color: var(--ink-2); }
.mring > svg:not(.ic) { position: absolute; inset: 0; rotate: -90deg; }
.mring circle { fill: none; stroke-width: 4; }
.mring__bg { stroke: var(--fill); }
.mring__fg { stroke: var(--c); stroke-linecap: round; }
.mring--done { border-radius: 50%; background: var(--good); color: #fff; }
.mring--done .ic { width: 22px; height: 22px; stroke-width: 3; }

/* Load chart: weekly distance (bars) and long run (line), one km axis */
.chart { position: relative; margin-top: 40px; }
.chart__plot { position: relative; height: 190px; margin-left: 30px; }
.chart__grid { position: absolute; inset: 0; pointer-events: none; }
.chart__grid div { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
.chart__grid span { position: absolute; right: calc(100% + 8px); top: -8px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.chart__bars { position: absolute; inset: 0; display: flex; align-items: flex-end; }
.bar-col { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; padding: 0; border: 0; background: none; border-radius: 6px; }
.bar { position: relative; width: min(22px, 68%); border-radius: 4px 4px 0 0; background: color-mix(in srgb, var(--c, var(--accent)) 32%, var(--surface)); overflow: hidden; transition: height .5s var(--ease), background-color .2s; }
.bar__done { position: absolute; left: 0; right: 0; bottom: 0; background: var(--c, var(--accent)); transition: height .5s var(--ease); }
.bar-col--hit .bar { display: none; }
.chart__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.chart__switch { flex: none; width: 196px; }
.chart__area { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.chart__area .plan { fill: none; stroke: color-mix(in srgb, var(--accent) 38%, var(--surface)); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.chart__area .run { fill: color-mix(in srgb, var(--accent) 12%, transparent); stroke: none; }
.chart__area .runline { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.chart__cross { position: absolute; top: 0; bottom: 0; width: 1px; margin-left: -.5px; background: var(--line-2); pointer-events: none; transition: left .2s var(--ease); }
.chart__pin { position: absolute; width: 10px; height: 10px; margin: 0 0 -5px -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); pointer-events: none; transition: left .2s var(--ease), bottom .2s var(--ease); }
.chart__end { position: absolute; right: 0; transform: translateY(-130%); font-size: 12.5px; font-weight: 650; color: var(--ink-2); white-space: nowrap; }
.chart__x { display: flex; justify-content: space-between; margin: 8px 0 0 30px; font-size: 12px; color: var(--ink-3); }
.bar-col.is-sel .bar { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
@media (hover: hover) { .bar-col:hover .bar { background: color-mix(in srgb, var(--accent) 40%, var(--surface)); } }
.bar-col__mark { position: absolute; top: -22px; left: 50%; translate: -50% 0; font: 700 11px/1 var(--ui); color: var(--ink); white-space: nowrap; }
.bar-col__mark .ic { width: 16px; height: 16px; color: var(--c-race); }
.chart__phases { display: flex; gap: 3px; margin: 10px 0 0 30px; }
.chart__phases span { min-width: 0; padding-top: 6px; border-top: 3px solid var(--c, var(--line-2)); font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart__readout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; min-height: 48px; margin-top: 16px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); font-size: 14.5px; color: var(--ink-2); }
.chart__readout b { font-size: 16px; color: var(--ink); }
.chart__readout strong { color: var(--ink); }
.legend2 { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 13.5px; color: var(--ink-2); }
.legend2 span { display: inline-flex; align-items: center; gap: 8px; }
.legend2 i { display: inline-block; }
.legend2 .lg-bar { width: 10px; height: 12px; border-radius: 3px 3px 0 0; background: var(--c, var(--accent)); }
.legend2 .lg-bar--soft { background: color-mix(in srgb, var(--c, var(--accent)) 32%, var(--surface)); }
.legend2 .lg-line { width: 18px; height: 3px; border-radius: 2px; background: var(--accent); }
.legend2 .lg-line--soft { background: color-mix(in srgb, var(--accent) 38%, var(--surface)); }

/* 12. LEARN ------------------------------------------------------------------- */

/* 13. SHEETS & TOAST ---------------------------------------------------------- */
.sheet {

/* 14. CHARM & MOTION ---------------------------------------------------------- */
.burst { position: fixed; z-index: 70; width: 0; height: 0; pointer-events: none; }

}
@keyframes sheet-up { from { transform: translateY(60px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes slide-in { from { transform: translateX(18px); opacity: 0; } to { transform: none; opacity: 1; } }

<noscript><div class="nojs"><p>This planner needs JavaScript to build and save your plan. Please turn it on and reload the page.</p></div></noscript>
<div id="app"></div>
<dialog class="sheet" id="run-sheet" aria-labelledby="run-sheet-title"></dialog>

<script>
(() => {
'use strict';

/* ======================================================================
   Helpers
   ====================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r05 = x => Math.round(x * 2) / 2;
const mid = r => (r[0] + r[1]) / 2;
const pad = n => String(n).padStart(2, '0');
const KEY = 'tedw-runplan-v1';
const MI = 1.609344;
const DAY = 864e5;

const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const diffDays = (a, b) => Math.round((b - a) / DAY);
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const dowMon = d => (d.getDay() + 6) % 7;
const mondayOf = d => addDays(d, -dowMon(d));
const DOW = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const DOW3 = DOW.map(d => d.slice(0, 3));
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON3 = MONTHS.map(m => m.slice(0, 3));
const fmtDate = d => `${DOW[dowMon(d)]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const fmtShort = d => `${DOW3[dowMon(d)]} ${d.getDate()} ${MON3[d.getMonth()]}`;
const fmtRangeDates = (a, b) => a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MON3[b.getMonth()]}` : `${a.getDate()} ${MON3[a.getMonth()]} – ${b.getDate()} ${MON3[b.getMonth()]}`;

const mmss = s => { s = Math.round(s); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const hms = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };

/* Read a race time typed as 25:30, 25.30, 1:55:00 or 1:55 */
function parseTime(str, km) {
  const parts = String(str || '').trim().split(/[^0-9]+/).filter(Boolean).map(Number);
  if (!parts.length || parts.length > 3) return null;
  let s;
  if (parts.length === 3) s = parts[0] * 3600 + parts[1] * 60 + parts[2];
  else if (parts.length === 2) { s = parts[0] * 60 + parts[1]; if (s / km < 150) s = parts[0] * 3600 + parts[1] * 60; }
  else { s = parts[0] * 60; if (s / km < 150) s = parts[0] * 3600; }
  if (s / km < 150 || s / km > 1200) return null;
  return s;
}

/* ======================================================================
   Training guidance, by distance
   rec/min: recommended and minimum plan length in weeks
   ramp:    most weeks of progressive build (extra weeks become foundation)
   taper:   taper weeks including race week
   peak:    longest long run (km) for fast / middling / newer runners
   ====================================================================== */
const DIST = {
  '5k': { km: 5, label: '5K', name: '5K', rec: 8, min: 4, ramp: 10, taper: 1, goal: 35 * 60, range: [15 * 60, 55 * 60, 15], peak: [8, 7, 6], inc: .5, easy: [.75, 2, 5], runs: '3' },
  '10k': { km: 10, label: '10K', name: '10K', rec: 10, min: 6, ramp: 12, taper: 1, goal: 75 * 60, range: [32 * 60, 115 * 60, 30], peak: [13, 12, 10], inc: 1, easy: [.6, 3, 8], runs: '3 or 4' },
  'hm': { km: 21.0975, label: 'Half marathon', name: 'half marathon', rec: 12, min: 8, ramp: 16, taper: 2, goal: 150 * 60, range: [70 * 60, 210 * 60, 60], peak: [20, 18, 16], inc: 1.5, easy: [.55, 3, 10], runs: '3 or 4' },
  'm': { km: 42.195, label: 'Marathon', name: 'marathon', rec: 18, min: 12, ramp: 20, taper: 3, goal: 315 * 60, range: [150 * 60, 420 * 60, 60], peak: [32, 32, 30], inc: 2, easy: [.5, 5, 13], runs: '4 or 5' },
};
const PBD = { '5k': 5, '10k': 10, 'hm': 21.0975 };

/* Which days each run lands on (0 = Monday), by runs per week */
const SLOTS = {
  false: {
    2: [[2, 'q'], [6, 'long']],
    3: [[1, 'q'], [3, 'easy'], [6, 'long']],
    4: [[1, 'q'], [2, 'easy'], [4, 'easy'], [6, 'long']],
    5: [[0, 'easy'], [1, 'q'], [3, 'tempo'], [5, 'easy'], [6, 'long']],
    6: [[0, 'easy'], [1, 'q'], [2, 'easy'], [3, 'tempo'], [5, 'easy'], [6, 'long']],
  },
  true: {
    2: [[5, 'pr'], [6, 'long']],
    3: [[1, 'q'], [5, 'pr'], [6, 'long']],
    4: [[1, 'q'], [3, 'easy'], [5, 'pr'], [6, 'long']],
    5: [[0, 'easy'], [1, 'q'], [3, 'tempo'], [5, 'pr'], [6, 'long']],
    6: [[0, 'easy'], [1, 'q'], [2, 'easy'], [3, 'tempo'], [5, 'pr'], [6, 'long']],
  },
};
const SLOT_NAME = { q: 'Speed', easy: 'Easy', tempo: 'Tempo', long: 'Long run', pr: 'parkrun' };

/* Predict a time at the race distance from the nearest PB (Riegel) */
function estimate(p) {
  const D = DIST[p.distance].km;
  let best = null, gap = Infinity, from = null;
  for (const k in PBD) {
    const t = p.pbs && p.pbs[k];
    if (!t) continue;
    const g = Math.abs(Math.log(PBD[k] / D));
    if (g < gap) { gap = g; from = k; best = t * Math.pow(D / PBD[k], D > PBD[k] ? 1.07 : 1.06); }
  }
  return best ? { sec: best, from } : null;
}
function snapGoal(dk, s) { const [a, b, st] = DIST[dk].range; return clamp(Math.round(s / st) * st, a, b); }
function defaultGoal(p) {
  const e = estimate(p);
  return snapGoal(p.distance, e ? e.sec * .98 : DIST[p.distance].goal);
}
const isNewRunner = p => !(p.pbs && (p.pbs['5k'] || p.pbs['10k'] || p.pbs['hm'])) && (p.longest || 0) < 5;

/* Training paces (seconds per km) from a race-time level, via 5K-equivalent pace */
function zones(T, dk, goal) {
  const D = DIST[dk].km, p5 = T * Math.pow(5 / D, 1.06) / 5, g = goal / D;
  return {
    easy: [p5 * 1.2, p5 * 1.32], long: [p5 * 1.22, p5 * 1.35], steady: [p5 * 1.11, p5 * 1.17],
    tempo: [p5 * 1.05, p5 * 1.09], parkrun: [p5 * 1.06, p5 * 1.11], prsteady: [p5 * 1.02, p5 * 1.06], tenk: [p5 * 1.025, p5 * 1.05], interval: [p5 * .98, p5 * 1.01], race: [g - 3, g + 3],
  };
}
const scaleZ = (Z, f) => Object.fromEntries(Object.entries(Z).map(([k, v]) => [k, v.map(x => x * f)]));

/* How realistic is the goal? */
function verdict(p, weeks) {
  const e = estimate(p);
  if (!e) return { level: 'unknown', label: 'Best guess', cls: 'pill', text: `No PB yet, so this target is a best guess, and that’s fine. Run a parkrun or a 5K in the first few weeks, add the time as a PB, and your paces will update.` };
  const imp = (e.sec - p.goal) / e.sec;
  const cap = Math.min(.12, .006 * Math.max(weeks, 1) + .01);
  const now = hms(snapGoal(p.distance, e.sec));
  if (imp <= 0) return { level: 'comfortable', label: 'Comfortable', cls: 'pill pill--go', text: `Based on your PB you could run about ${now} today, so this is well within reach. Fancy something a bit braver?` };
  if (imp <= cap * .5) return { level: 'realistic', label: 'Realistic', cls: 'pill pill--go', text: `Based on your PB you could run about ${now} today. With ${weeks} weeks of training, this is a realistic step up.` };
  if (imp <= cap) return { level: 'stretch', label: 'Stretch', cls: 'pill pill--pen', text: `A proper stretch from about ${now} today. Doable if you’re consistent, so make sure the easy runs stay easy.` };
  return { level: 'ambitious', label: 'Very ambitious', cls: 'pill pill--pink', text: `That’s a big jump from about ${now} today. A target near ${hms(snapGoal(p.distance, e.sec * (1 - cap * .6)))} is kinder on your body. You can always speed up later.` };
}

/* ======================================================================
   Plan generator
   ====================================================================== */
function generate(p, startISO, units, overrides, moves) {
  const dk = p.distance, D = DIST[dk];
  const start = parseISO(startISO), race = parseISO(p.date), raceISO = p.date;
  const w0 = mondayOf(start);
  const N = Math.max(1, Math.round((mondayOf(race) - w0) / (7 * DAY)) + 1);
  const T = Math.min(D.taper, N);
  const B = N - T;                                   // weeks before the taper
  const rampLen = Math.min(B, D.ramp), rampStart = B - rampLen;
  const peakN = rampLen >= 6 ? 2 : rampLen >= 3 ? 1 : 0;
  const baseN = Math.round((rampLen - peakN) * .45);
  const est = estimate(p), goal = p.goal;
  const cur = est ? est.sec : goal * 1.06;
  const fresh = isNewRunner(p);
  const n = clamp(p.runs, 2, 6);
  const slots = SLOTS[!!p.parkrun][n];
  const F = fmt(units);

  // Long run: start where you are, build in capped steps, cut back every fourth week
  const goalZ = zones(goal, dk, goal);
  let peak = D.peak[goal / D.km < 300 ? 0 : goal / D.km < 375 ? 1 : 2];
  if (dk === 'm') peak = Math.min(peak, Math.max(26, 210 * 60 / mid(goalZ.long)));
  const Ls = clamp(r05((p.longest || 0) * .8), 2, r05(peak * .85));   // start a little below your longest run, not at it
  let peakEff = peak, short = false;
  if (rampLen > 1 && (peak - Ls) / (rampLen - 1) > D.inc) { peakEff = Ls + D.inc * (rampLen - 1); short = true; }
  if (rampLen === 1) { peakEff = Math.min(peak, Ls + D.inc); short = peakEff < peak; }
  if (rampLen === 0) { peakEff = Ls; short = Ls < peak; }
  const taperFr = { '5k': [], '10k': [], 'hm': [.65], 'm': [.75, .55] }[dk];

  const weeks = [], ctr = {};
  let longestSoFar = 0;
  for (let i = 0; i < N; i++) {
    const ws = addDays(w0, 7 * i), we = addDays(ws, 6);
    const isRaceWk = i === N - 1;
    let phase, r = i - rampStart, cut = false, L;
    if (i < rampStart) { phase = 'foundation'; cut = (i + 1) % 4 === 0; L = Ls * (cut ? .8 : 1); }
    else if (i < B) {
      phase = r < baseN ? 'base' : r < rampLen - peakN ? 'build' : 'peak';
      cut = r > 0 && (r + 1) % 4 === 0 && r < rampLen - 1;
      const lin = rampLen > 1 ? Ls + (peakEff - Ls) * r / (rampLen - 1) : peakEff;
      L = lin * (cut ? .75 : 1);
    } else {
      phase = 'taper';
      const ti = i - B;                                // 0-based taper week
      L = isRaceWk ? 0 : peakEff * (taperFr[ti] ?? .6);
    }
    L = Math.max(2, r05(L));

    // Paces move from today's fitness towards the goal as the weeks go by
    const prog = B > 1 ? clamp(i / (B - 1), 0, 1) : 1;
    const level = goal >= cur ? goal : cur + (goal - cur) * prog;
    const Z = zones(level, dk, goal);
    const [ef, emin, emax] = D.easy;
    const E = clamp(r05(L * ef), emin, emax) * (phase === 'taper' ? .85 : 1);
    const rw = fresh && L < 5 && i < 8 ? (i < 2 ? [2, 1] : i < 4 ? [3, 1] : [4, 1]) : null;

    const runs = [];
    let easyCount = 0;
    for (const [dow, slot] of slots) {
      const d = addDays(ws, dow), di = iso(d);
      if (d < start || d > race) continue;
      const daysToRace = diffDays(d, race);
      const buggyDefault = (p.buggyDays || []).includes(dow);
      const buggy = overrides && di in overrides ? !!overrides[di] : buggyDefault;
      const Zr = buggy ? scaleZ(Z, 1.07) : Z;
      const ctx = { Z: Zr, F, dk, D, goal, rw, buggy, cut };
      if (di === raceISO) continue;                    // race day added below
      const make = ctx => {
      let run = null;
      if (isRaceWk) {
        if (daysToRace === 1) { if (slot === 'pr') run = S.parkrun(ctx, 'shake'); }
        else if (slot === 'q') run = daysToRace >= 3 ? S.sharpen(ctx) : S.shakeout(ctx);
        else if (slot === 'pr') run = S.parkrun(ctx, 'easy');
        else if (slot === 'easy' || slot === 'tempo') run = daysToRace === 2 ? S.shakeout(ctx) : S.easy(ctx, Math.min(E, dk === 'm' ? 8 : 5), { short: true });
      } else {
        const k = t => { const v = ctr[t] || 0; if (!cut) ctr[t] = v + 1; return cut ? Math.max(0, v - 1) : v; };
        switch (slot) {
          case 'long': {
            const ff = (phase === 'peak' || (phase === 'build' && r >= rampLen - peakN - 2)) && !cut && (dk === 'hm' || dk === 'm') && (k('ff') % 2 === 0);
            run = ff ? S.fastFinish(ctx, L) : S.long(ctx, L);
            if (!cut && L > longestSoFar) { run.newLongest = longestSoFar > 0; longestSoFar = L; }
            break;
          }
          case 'easy':
            run = (easyCount === 0 && n >= 4 && (phase === 'build' || phase === 'peak')) ? S.strides(ctx, E) : S.easy(ctx, easyCount ? E * .85 : E);
            easyCount++;
            break;
          case 'q': {
            let t;
            const sep = slots.some(s => s[1] === 'tempo');
            if (phase === 'foundation') t = ['strides', 'fartlek'][(ctr.fq = (ctr.fq || 0) + 1) % 2];
            else if (phase === 'base') t = fresh && r < 2 ? 'strides' : ['fartlek', 'hills'][(ctr.bq = (ctr.bq || 0) + 1) % 2];
            else if (phase === 'build') t = sep ? 'intervals' : ['intervals', 'tempo'][(ctr.uq = (ctr.uq || 0) + 1) % 2];
            else if (phase === 'peak') t = (dk === '5k' || dk === '10k') ? (sep ? 'intervals' : ['intervals', 'tempo'][(ctr.uq = (ctr.uq || 0) + 1) % 2]) : (sep ? 'intervals' : ['racepace', 'intervals'][(ctr.pq = (ctr.pq || 0) + 1) % 2]);
            else t = (dk === 'hm' || dk === 'm') ? 'taperpace' : 'sharpen';
            run = t === 'strides' ? S.strides(ctx, E) : t === 'taperpace' ? S.racepace(ctx, 0) : t === 'sharpen' ? S.sharpen(ctx) : S[t](ctx, k(t));
            break;
          }
          case 'tempo': {
            if (phase === 'foundation' || phase === 'base') run = S.strides(ctx, E * .9);
            else if (phase === 'taper') run = S.easy(ctx, E * .85);
            else if (phase === 'peak' && (dk === 'hm' || dk === 'm') && (ctr.tp = (ctr.tp || 0) + 1) % 2 === 0) run = S.racepace(ctx, k('racepace'));
            else run = S.tempo(ctx, k('tempo'));
            break;
          }
          case 'pr': {
            const hard = (phase === 'build' || phase === 'peak') && cut;
            const role = n === 2 && (phase === 'build' || phase === 'peak') && !cut;
            run = phase === 'taper' || phase === 'foundation' || phase === 'base' ? S.parkrun(ctx, 'easy')
              : hard ? S.parkrun(ctx, 'tt') : role ? S.parkrun(ctx, 'tempo') : S.parkrun(ctx, 'steady');
            break;
          }
        }
      }
      return run;
      };
      // Speed and hill sessions are never buggy runs: build those solo instead
      const snap = JSON.stringify(ctr), ls0 = longestSoFar, ec0 = easyCount;
      let run = make(ctx), blocked = false;
      if (run && buggy && run.canBuggy === false) {
        Object.keys(ctr).forEach(x => delete ctr[x]); Object.assign(ctr, JSON.parse(snap)); longestSoFar = ls0; easyCount = ec0;
        run = make({ ...ctx, Z, buggy: false }); blocked = true;
      }
      if (!run) continue;
      const isB = buggy && !blocked;
      Object.assign(run, { date: di, id: di, dow, buggy: isB, canBuggy: run.canBuggy !== false, slot });
      if (blocked) run.note = BUGGY_NOTE.blocked;
      if (isB) run.note = (run.note ? run.note + ' ' : '') + BUGGY_NOTE[run.cat === 'parkrun' ? 'parkrun' : (run.cat === 'speed' || run.cat === 'tempo') ? 'hard' : 'easy'];
      runs.push(run);
    }
    if (isRaceWk && race >= start) runs.push(Object.assign(S.race(p, goal, F, dk), { date: raceISO, id: raceISO, dow: dowMon(race), buggy: false, canBuggy: false, slot: 'race' }));
    // Hard parkrun the day before the long run: say so
    runs.forEach((x, j) => { const prev = runs[j - 1]; if (x.slot === 'long' && prev && prev.kind === 'parkrun-tt' && diffDays(parseISO(prev.date), parseISO(x.date)) === 1) x.note = (x.note ? x.note + ' ' : '') + 'Take it extra gently after yesterday’s parkrun effort.'; });
    // Runs the user has moved to another day (same week, free days only)
    runs.forEach(x => { x.canMove = x.cat !== 'parkrun' && x.kind !== 'race'; });
    const taken = new Set(runs.map(x => x.date));
    runs.forEach(x => {
      const m = moves && moves[x.id];
      if (!m || !x.canMove || m === x.date) return;
      const md = parseISO(m);
      if (md < ws || md > we || md < start || md >= race || taken.has(m)) return;
      taken.delete(x.date); taken.add(m); x.date = m; x.dow = dowMon(md); x.moved = true;
    });
    runs.sort((a, b) => a.date < b.date ? -1 : 1);
    weeks.push({ i, n: i + 1, start: ws, end: we, phase, cut, runs, Z, km: runs.reduce((s, x) => s + x.km, 0), firstOfPhase: i === 0 || (weeks[i - 1] && weeks[i - 1].phase !== phase) });
  }
  return { weeks, N, short, peak, peakEff, est, fresh, Ls };
}

const BUGGY_NOTE = {
  blocked: 'A solo session: speed work and hills aren’t buggy runs. Pushing the buggy is challenge enough on its own!',
  easy: 'Buggy run: paces are about 7% slower, so run by feel. Use the wrist strap and stick to smooth, quiet paths.',
  hard: 'Buggy run: keep the quick bits on flat, smooth paths and run them by effort, not pace. If it feels unsafe, swap this with a solo day.',
  parkrun: 'Most parkruns welcome running buggies: start near the back and check your event’s page first.',
};

/* Formatters bound to the chosen units */
function fmt(units) {
  const mi = units === 'mi';
  const dist = (km, exact) => {
    if (mi) { const v = km / MI; return `${exact ? v.toFixed(1) : String(r05(v)).replace(/\.0$/, '')} mi`; }
    return `${exact ? km.toFixed(1).replace(/\.0$/, '') : String(Math.round(km * 10) / 10)} km`;
  };
  const pace = s => mi ? `${mmss(s * MI)}/mi` : `${mmss(s)}/km`;
  const range = r => mi ? `${mmss(r[0] * MI)}–${mmss(r[1] * MI)}/mi` : `${mmss(r[0])}–${mmss(r[1])}/km`;
  const rep = m => m >= 1000 ? `${String(m / 1000).replace(/\.0$/, '')} km` : `${m} m`;
  return { dist, pace, range, rep, unit: mi ? 'mi' : 'km', mi };
}
const dur = mins => mins < 60 ? `${Math.max(5, Math.round(mins / 5) * 5)} min` : `${Math.floor(mins / 60)} h ${pad(Math.round((mins % 60) / 5) * 5 % 60)}`;

/* Session builders. Each returns a run: what, why, how far, how fast */
const T = (t, w) => `<button type="button" class="term" data-term="${t}">${w}<svg class="term__i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.6"/><path d="M8 7.3v3.9M8 4.9v.1"/></svg><span class="sr-only"> (what does this mean?)</span></button>`;
const WU = 'Warm up: 10 min easy jog';
const CD = 'Cool down: 10 min easy jog';
const S = {
  easy(c, km, o = {}) {
    km = r05(km);
    const steps = c.rw
      ? [`Cover ${c.F.dist(km)} by running ${c.rw[0]} min, then walking ${c.rw[1]} min, and repeating`, `Keep the running bits at ${T('conversational', 'conversational pace')}`, 'Walk breaks are part of the plan, not a failure']
      : [`${c.F.dist(km)} at ${T('conversational', 'conversational pace')}`, 'If you can’t chat in full sentences, slow down'];
    return { kind: 'easy', cat: 'easy', title: o.short ? 'Short easy run' : c.rw ? 'Easy run/walk' : 'Easy run', purpose: 'Aerobic base', km, pace: 'easy', steps, mins: km * mid(c.Z.easy) / 60 };
  },
  strides(c, km) {
    km = r05(km);
    return {
      kind: 'strides', cat: 'easy', title: 'Easy run + strides', purpose: 'Aerobic base + form', km: km + .5, pace: 'easy',
      steps: [`${c.F.dist(km)} at ${T('conversational', 'conversational pace')}`, `Then 6 × 20-second ${T('strides', 'strides')}: build up to about 90% of top speed, stay relaxed, walk back to recover`],
      mins: km * mid(c.Z.easy) / 60 + 6,
    };
  },
  long(c, km) {
    const steps = c.rw ? [`Cover ${c.F.dist(km)} by running ${c.rw[0]} min, then walking ${c.rw[1]} min, and repeating`, 'Go slower than feels necessary. Finishing is the goal'] : [`${c.F.dist(km)} at ${T('conversational', 'conversational pace')}, slower than you think`, 'Walk breaks are fine, especially on hills'];
    if (km >= 12) steps.push('Take water, and practise the gels or snacks you plan to use on race day');
    return { kind: 'long', cat: 'long', title: c.cut ? 'Shorter long run' : 'Long run', purpose: 'Endurance', km, pace: 'long', steps, mins: km * mid(c.Z.long) / 60, note: c.cut ? 'Shorter on purpose: it’s a deload week, so your body can absorb the training.' : '' };
  },
  fastFinish(c, km) {
    const ff = c.dk === 'm' ? Math.min(8, r05(km * .3)) : Math.min(4, r05(km * .2));
    return {
      kind: 'fastfinish', cat: 'long', title: 'Long run, fast finish', purpose: 'Endurance + race practice', km, pace: 'long',
      steps: [`First ${c.F.dist(km - ff)} at ${T('conversational', 'conversational pace')}`, `Last ${c.F.dist(ff)} at ${T('racepace', 'goal race pace')}: ${c.F.range(c.Z.race)}`, 'Take water, and practise your race-day fuel'],
      mins: ((km - ff) * mid(c.Z.long) + ff * mid(c.Z.race)) / 60,
    };
  },
  fartlek(c, k) {
    const reps = Math.min(10, 5 + k), ez = mid(c.Z.easy);
    return {
      kind: 'fartlek', cat: 'speed', canBuggy: false, title: 'Fartlek', purpose: 'Speed', pace: 'tempo',
      steps: [WU, `${reps} × 1 min quicker (about ${c.F.range(c.Z.tempo)}, or just “brisk”), with 2 min easy jogging between`, CD],
      km: r05(1200 / ez + reps * (60 / mid(c.Z.tempo) + 120 / ez)), mins: 20 + reps * 3,
    };
  },
  hills(c, k) {
    const reps = Math.min(10, 4 + k);
    return {
      kind: 'hills', cat: 'speed', canBuggy: false, title: 'Hill reps', purpose: 'Strength', pace: 'interval',
      steps: [WU, 'Find a steady slope that takes about a minute to run up', `${reps} × 45 seconds uphill at a hard effort (8 out of 10), tall posture, quick arms`, 'Jog or walk back down to recover', CD],
      km: r05(1200 / mid(c.Z.easy) + reps * .3), mins: 20 + reps * 2.5,
    };
  },
  intervals(c, k) {
    const M = {
      '5k': [[6, 400, 90], [8, 400, 90], [5, 600, 90], [6, 600, 90], [5, 800, 120], [6, 800, 120], [4, 1000, 120], [5, 1000, 120]],
      '10k': [[6, 400, 90], [5, 800, 90], [6, 800, 90], [4, 1000, 90], [5, 1000, 90], [6, 1000, 90], [3, 1600, 120], [4, 1600, 120]],
      'hm': [[6, 400, 90], [5, 800, 90], [6, 800, 90], [4, 1000, 90], [5, 1000, 90], [6, 1000, 90], [4, 1600, 120], [3, 2000, 120]],
      'm': [[5, 800, 90], [6, 800, 90], [5, 1000, 90], [6, 1000, 90], [4, 1600, 120], [5, 1600, 120], [3, 2000, 120], [4, 2000, 120]],
    }[c.dk];
    const [reps, m, rest] = M[Math.min(k, M.length - 1)];
    const pk = m >= 1600 ? 'tenk' : 'interval', ez = mid(c.Z.easy);
    return {
      kind: 'intervals', cat: 'speed', canBuggy: false, title: 'Intervals', purpose: 'Speed', pace: pk,
      steps: [WU, `${reps} × ${c.F.rep(m)} at ${pk === 'tenk' ? '10K' : '5K'} effort: ${c.F.range(c.Z[pk])}`, `${rest} seconds easy jog or walk between each`, CD],
      km: r05(2 * 600 / ez + reps * m / 1000 + (reps - 1) * rest / (ez * 1.3)),
      mins: 20 + (reps * m / 1000) * mid(c.Z[pk]) / 60 + (reps - 1) * rest / 60,
    };
  },
  tempo(c, k) {
    const M = { '5k': [10, 12, 15, 15, 18, 20], '10k': [12, 15, 18, 20, 22, 25], 'hm': [15, 18, 20, 22, 25, 28, 30], 'm': [20, 25, 30, 35, 40, 45] }[c.dk];
    const mins = M[Math.min(k, M.length - 1)], split = k < 2 && mins >= 15, ez = mid(c.Z.easy);
    return {
      kind: 'tempo', cat: 'tempo', title: 'Tempo run', purpose: 'Stamina', pace: 'tempo',
      steps: [WU, split ? `2 × ${mins / 2} min at ${T('tempo', 'tempo pace')}: ${c.F.range(c.Z.tempo)}, with 2 min easy jog between` : `${mins} min at ${T('tempo', 'tempo pace')}: ${c.F.range(c.Z.tempo)}`, CD],
      km: r05(1200 / ez + mins * 60 / mid(c.Z.tempo) + (split ? 120 / ez : 0)), mins: 20 + mins + (split ? 2 : 0),
    };
  },
  racepace(c, k) {
    const M = {
      '5k': [[5, .8], [4, 1], [3, 1.6], [5, 1]], '10k': [[4, 1.6], [3, 2], [5, 1.6], [3, 3]],
      'hm': [[2, 2], [2, 3], [3, 2.5], [2, 4], [3, 3], [2, 5]], 'm': [[1, 6], [1, 8], [1, 10], [1, 12], [1, 13], [1, 14]],
    }[c.dk];
    const [reps, km] = M[Math.min(k, M.length - 1)], ez = mid(c.Z.easy);
    return {
      kind: 'racepace', cat: 'tempo', title: 'Race-pace run', purpose: 'Race practice', pace: 'race',
      steps: [WU, reps > 1 ? `${reps} × ${c.F.dist(km)} at ${T('racepace', 'goal race pace')}: ${c.F.range(c.Z.race)}` : `${c.F.dist(km)} at ${T('racepace', 'goal race pace')}: ${c.F.range(c.Z.race)}`, ...(reps > 1 ? ['2 min easy jog between each'] : []), CD],
      km: r05(1200 / ez + reps * km + (reps - 1) * 120 / (ez * 1.2)), mins: 20 + reps * km * mid(c.Z.race) / 60 + (reps - 1) * 2,
    };
  },
  sharpen(c) {
    const long = c.dk === 'hm' || c.dk === 'm', ez = mid(c.Z.easy);
    return {
      kind: 'sharpen', cat: 'tempo', title: 'Race-pace sharpener', purpose: 'Stay sharp', pace: 'race',
      steps: [WU, long ? `3 × 1 km at ${T('racepace', 'goal race pace')}: ${c.F.range(c.Z.race)}, 2 min jog between` : `4 × 400 m at ${T('racepace', 'goal race pace')}: ${c.F.range(c.Z.race)}, 90 seconds jog between`, CD],
      km: r05(1200 / ez + (long ? 3.5 : 2)), mins: long ? 40 : 32,
    };
  },
  shakeout(c) {
    return {
      kind: 'shakeout', cat: 'easy', title: 'Shakeout run', purpose: 'Freshen up', pace: 'easy',
      steps: ['15–20 min very easy', `Finish with 4 × 15-second ${T('strides', 'strides')} at race pace`, 'Then put your feet up'],
      km: r05(18 * 60 / mid(c.Z.easy)), mins: 20,
    };
  },
  parkrun(c, mode) {
    const base = { cat: 'parkrun', km: 5, mins: 5 * mid(c.Z.easy) / 60 };
    if (mode === 'tt') return { ...base, kind: 'parkrun-tt', canBuggy: false, title: 'parkrun time trial', purpose: 'Fitness check', pace: 'interval', km: 6, mins: 40,
      steps: ['Warm up: 10 min easy jog before the start', 'Run the 5K as hard as you can hold: start a little steady, then push after halfway', 'Note your time. Seeing it fall is the best motivation'] };
    if (mode === 'tempo') return { ...base, kind: 'parkrun-tempo', title: 'parkrun tempo', purpose: 'Stamina', pace: 'tempo',
      steps: ['First 1 km easy', `Middle 3 km at ${T('tempo', 'tempo pace')}: ${c.F.range(c.Z.tempo)}`, 'Last 1 km easy, and cheer people in'] };
    if (mode === 'steady') return { ...base, kind: 'parkrun', title: 'Steady parkrun', purpose: 'Race practice', pace: 'prsteady',
      steps: ['Start near the middle of the pack so you’re not swept off too fast', `Settle into a strong, steady pace: ${c.F.range(c.Z.prsteady)}`, 'Finish strong if you feel good, then thank a marshal'] };

      steps: ['Jog it very gently, or volunteer instead and cheer everyone on', 'No racing today. Save it for tomorrow'] };
    return { ...base, kind: 'parkrun-easy', title: 'parkrun', purpose: 'Speed endurance', pace: 'parkrun',
      steps: ['Start near the middle of the pack so you’re not swept off too fast', `Run at a brisk, controlled pace: ${c.F.range(c.Z.parkrun)}`, 'Keep a little in reserve. This isn’t a race (yet!)'] };
  },
  race(p, goal, F, dk) {
    const D = DIST[dk], g = goal / D.km;

      'Nothing new today: same shoes, kit and breakfast you’ve trained in',
      `Start slower than goal pace for the first ${dk === '5k' ? 'few minutes' : 'couple of km'}. It will feel too easy`,
      `Settle into goal pace, ${F.pace(g)}, for a ${hms(goal)} finish`,

    steps.push('Save something for the end, and smile for the photos');
    return { kind: 'race', cat: 'race', title: p.event ? p.event : `${D.label} race day`, purpose: 'Race day', km: D.km, exact: true, pace: 'race', steps, mins: goal / 60 };
  },
};

function syncSetup() {
  const d = draft, F = fmt(state.units);
  const wk = weeksUntil(d.date, editing ? state.start : null), D = DIST[d.distance];
  const dh = $('#date-hint');
  if (dh) dh.textContent = !d.date ? `Most ${D.name} plans run for about ${D.rec} weeks.`
    : wk < D.min ? `${wk} week${wk === 1 ? '' : 's'} away is tight for a ${D.name} (${D.min}+ recommended). We’ll make the most of it and keep it gentle.`
    : wk < D.rec ? `${wk} weeks to go. A little shorter than the usual ${D.rec}, but very doable.`
    : `${wk} weeks to go. Plenty of time${wk > D.ramp + D.taper ? ', so we’ll start with some easy foundation weeks' : ''}.`;
  const rh = $('#runs-hint'); if (rh) rh.textContent = runsHint(d);
  const bl = $('#buggy-list');
  if (bl) {
    const slots = buggySlots(d);
    d.buggyDays = (d.buggyDays || []).filter(x => slots.some(s => s[0] === x));
    bl.innerHTML = slots.map(([dow, s]) => `<label class="chipbox"><input type="checkbox" value="${dow}" data-buggy-day ${d.buggyDays.includes(dow) ? 'checked' : ''}><span>${ic('check')}${DOW3[dow]} · ${SLOT_NAME[s]}</span></label>`).join('');
    $('#buggy-days').hidden = !d.buggy;
  }
  const go = $('#goal-out');
  if (go) {
    go.textContent = hms(d.goal);
    $('#goal-pace').textContent = `That’s ${F.pace(d.goal / D.km)} on average`;
    $('#verdict').innerHTML = verdictHTML(verdict(d, wk || D.rec));

}

function readStep(showErr) {
  const d = draft;
  if (step === 0) {
    d.name = $('#f-name').value.trim();
    const bad = !d.name; $('#err-name').hidden = !(bad && showErr); $('#f-name').setAttribute('aria-invalid', bad && showErr);
    if (bad && showErr) $('#f-name').focus();
    return !bad;
  }
  if (step === 1) {
    d.event = $('#f-event').value.trim(); d.date = $('#f-date').value;
    const bad = !d.date || parseISO(d.date) < addDays(today(), 7);
    $('#err-date').hidden = !(bad && showErr); $('#f-date').setAttribute('aria-invalid', bad && showErr);
    if (bad && showErr) $('#f-date').focus();
    return !bad;
  }
  if (step === 2) {
    let ok = true;
    $$('[data-pb]').forEach(inp => {
      const k = inp.dataset.pb, v = inp.value.trim(), err = $(`#pb-${k}-err`);
      if (!v) { delete d.pbs[k]; err.hidden = true; inp.removeAttribute('aria-invalid'); return; }
      const s = parseTime(v, PBD[k]);
      if (s) { d.pbs[k] = s; err.hidden = true; inp.removeAttribute('aria-invalid'); } else { ok = false; if (showErr) { err.hidden = false; inp.setAttribute('aria-invalid', 'true'); } }
    });
    if (!goalTouched) d.goal = defaultGoal(d);
    return ok;
  }
  return true;
}

function onSetupInput(t) {
  const d = draft;
  if (t.classList.contains('range')) setFill(t);
  if (t.name === 'distance') {
    d.distance = t.value;
    d.goal = goalTouched ? snapGoal(t.value, d.goal) : defaultGoal(d);
    d.longest = Math.min(d.longest, longestMax(t.value));
  }
  if (t.id === 'f-date') d.date = t.value;
  if (t.name === 'runs') d.runs = +t.value;
  if (t.name === 'parkrun') d.parkrun = t.checked;
  if (t.name === 'buggy') {
    d.buggy = t.checked;
    if (t.checked && !d.buggyDays.length) { const s = buggySlots(d).find(x => x[1] === 'easy' || x[1] === 'pr'); if (s) d.buggyDays = [s[0]]; }
    if (!t.checked) d.buggyDays = [];
  }
  if (t.hasAttribute('data-buggy-day')) d.buggyDays = $$('[data-buggy-day]:checked').map(x => +x.value);
  if (t.id === 'r-longest') { d.longest = +t.value; $('#o-longest').textContent = longestLabel(d.longest); }
  if (t.id === 'r-goal') { d.goal = +t.value; goalTouched = true; }
  if (t.hasAttribute('data-pb')) { const s = parseTime(t.value, PBD[t.dataset.pb]); if (s) d.pbs[t.dataset.pb] = s; else delete d.pbs[t.dataset.pb]; if (!goalTouched) d.goal = defaultGoal(d); }
  syncSetup();
}

function finishSetup() {
  const p = draft;
  if (!p.buggy) p.buggyDays = [];
  const wasNew = !state.profile;
  if (!wasNew) freezePast();
  state.profile = p;
  if (!state.start || wasNew) state.start = iso(today());
  if (wasNew) { state.done = {}; state.buggy = {}; state.moves = {}; state.frozen = null; }
  save(true);
  view = 'plan'; editing = false; if (wasNew) tab = 'today';
  render(); window.scrollTo(0, 0);
  toast(wasNew ? `Your plan’s ready, ${first(p.name)}. Let’s do this!` : `Plan updated, ${first(p.name)}.`, wasNew ? 'sparkle' : 'check');
}

/* ---------- App (the plan) ---------- */
let plan = null, openWeeks = new Set(), lastNow = null, sheetId = null, chartSel = null;
const allRuns = () => plan.weeks.flatMap(w => w.runs);
const runById = id => allRuns().find(r => r.id === id);
const weekOf = r => plan.weeks.find(w => w.runs.includes(r));
const isDone = r => !!state.done[r.id];
const goalPace = () => state.profile.goal / DIST[state.profile.distance].km;
const TABS = [['today', 'Today', 'today'], ['plan', 'Plan', 'plan'], ['adjust', 'Adjust', 'adjust'], ['learn', 'Learn', 'learn']];

function regen() { plan = generate(state.profile, state.start, state.units, state.buggy, state.moves); applyFrozen(); applyHistory(); return plan; }
/* Changing runs per week, the goal, PBs or any detail rebuilds the plan from
   today onwards only. Everything before today is frozen exactly as it was. */
function freezePast() {
  if (!plan || !state.profile) return;
  const ti = iso(today());
  const runs = allRuns().filter(r => r.date < ti).map(r => {
    const wk = weekOf(r), Z = r.buggy ? scaleZ(wk.Z, 1.07) : wk.Z;
    return { id: r.id, date: r.date, dow: r.dow, title: r.title, km: r.km, cat: r.cat, kind: r.kind, pace: r.pace, purpose: r.purpose, mins: r.mins,
      steps: r.steps, note: r.note || '', buggy: !!r.buggy, slot: r.slot, exact: !!r.exact, history: !!r.history,
      paceRange: r.paceRange || (r.pace === 'race' ? null : Z[r.pace]) };
  });
  state.frozen = { until: ti, runs };
}
function applyFrozen() {
  const f = state.frozen;
  if (!f || !f.until || !f.runs) return;
  const ids = new Set(f.runs.map(r => r.id));
  plan.weeks.forEach(w => {
    const past = f.runs.filter(r => { const d = parseISO(r.date); return d >= w.start && d <= w.end; })
      .map(r => ({ ...r, frozen: true, canMove: false, canBuggy: false }));
    w.runs = past.concat(w.runs.filter(r => r.date >= f.until && !ids.has(r.id))).sort((a, b) => a.date < b.date ? -1 : 1);
  });
}
const snapshotOf = r => ({ d: r.date, t: r.title, k: r.km, c: r.cat, m: Math.round(r.mins), b: r.buggy ? 1 : 0 });
const KIND_OF = { easy: ['easy', 'easy'], long: ['long', 'long'], speed: ['intervals', 'interval'], tempo: ['tempo', 'tempo'], parkrun: ['parkrun-easy', 'parkrun'], race: ['race', 'race'] };
function historyRun(rec, id) {
  const [kind, pace] = KIND_OF[rec.c] || KIND_OF.easy, date = rec.d || id;
  return { id, date, dow: dowMon(parseISO(date)), title: rec.t, km: rec.k, cat: rec.c || 'easy', kind, pace, purpose: 'Completed', mins: rec.m || rec.k * 6.5,
    steps: ['Done and dusted. Your plan has changed since, so this run is kept exactly as you ran it.'], buggy: !!rec.b, canBuggy: false, canMove: false, history: true, exact: rec.c === 'race' };
}
/* Keep every completed run as it was done, even if the plan is regenerated
   differently later (new settings, or an app update with new training rules) */
function applyHistory() {
  const byId = new Map(allRuns().map(r => [r.id, r]));
  let fill = false;
  Object.entries(state.done).forEach(([id, rec]) => {
    if (!rec || typeof rec !== 'object') return;
    const r = byId.get(id);
    if (!rec.t) { if (r) { Object.assign(rec, snapshotOf(r)); fill = true; } return; }   // older ticks: record them now
    if (r && r.title === rec.t && Math.abs(r.km - rec.k) < .01) return;
    const h = historyRun(rec, id);
    if (r) { const w = weekOf(r); w.runs[w.runs.indexOf(r)] = h; return; }
    const d = parseISO(h.date), w = plan.weeks.find(x => d >= x.start && d <= x.end);
    if (!w) return;
    w.runs = w.runs.filter(x => x.date !== h.date).concat(h).sort((a, b) => a.date < b.date ? -1 : 1);
  });
  plan.weeks.forEach(w => { w.km = w.runs.reduce((a, x) => a + x.km, 0); });
  if (fill) save();
}
function nowInfo() {
  const t = today(), ti = iso(t), runs = allRuns();
  return {
    t, ti,
    todayRun: runs.find(r => r.date === ti) || null,
    next: runs.find(r => r.date > ti && !isDone(r)) || null,
    missed: runs.filter(r => r.date < ti && !isDone(r) && diffDays(parseISO(r.date), t) <= 7),
    wkIdx: plan.weeks.findIndex(w => t >= w.start && t <= w.end),
  };
}
/* Consecutive runs ticked off, counting back from the most recent one that's due */
function streak(now) {
  const due = allRuns().filter(r => r.date <= now.ti).reverse();
  let n = 0;
  for (const r of due) { if (isDone(r)) n++; else if (r.date === now.ti) continue; else break; }
  return n;
}
function runPace(r) {
  if (r.paceRange) return fmt(state.units).range(r.paceRange);
  const F = fmt(state.units), wk = weekOf(r), Z = r.buggy ? scaleZ(wk.Z, 1.07) : wk.Z;
  return r.pace === 'race' ? F.pace(goalPace()) : F.range(Z[r.pace]);
}
const splitUnit = s => { const m = s.match(/^(.*?)\/(km|mi)$/); return m ? [m[1], `/${m[2]}`] : [s, '']; };

function renderApp() {
  const p = state.profile;
  document.title = `${first(p.name)}’s ${DIST[p.distance].name} plan | Run plan`;
  app.innerHTML = `
    <header class="top"><div class="top__in">
      <a class="brand" href="/run/">Run plan</a>
      <nav class="tabs" aria-label="Sections">${TABS.map(([k, l, i]) => `<button class="tab" data-tab="${k}" ${k === tab ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span></button>`).join('')}</nav>
      <span class="count" id="count"></span>

    ${TABS.map(([k]) => `<main class="page ${k === 'today' ? 'page--wide' : ''}" id="s-${k}" data-screen="${k}" ${k === tab ? '' : 'hidden'}></main>`).join('')}`;
  openWeeks = new Set(); lastNow = null; chartSel = null;

}

function refresh(firstTime) {
  const now = nowInfo();
  if (firstTime || lastNow !== now.ti) {
    openWeeks = new Set([now.wkIdx < 0 ? (now.t < plan.weeks[0].start ? 0 : plan.weeks.length - 1) : now.wkIdx]);

function renderCount(now) {

function setTab(t) {

  scrolls[tab] = window.scrollY;
  tab = t;
  $$('[data-screen]').forEach(s => { s.hidden = s.dataset.screen !== t; });

/* Shared pieces */

    <div class="stat">${ic('pace')}<b>${pv}<small>${pu}</small></b><span>${T(P.term, esc(P.name))}</span></div>

function cell(r, now) {

const NOTE = {

function renderToday(now) {

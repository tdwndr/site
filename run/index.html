    ${r.canBuggy ? `<label class="switch"><span class="switch__text"><span class="switch__title">Running this one with the buggy</span><span class="switch__sub">Slows the target pace by about 7%</span></span><input type="checkbox" role="switch" data-buggy-run="${r.date}" ${r.buggy ? 'checked' : ''}><span class="switch__track" aria-hidden="true"></span></label>` : ''}
  </div>`;
}
function tickHTML(r, big) {
  const done = !!state.done[r.date], d = parseISO(r.date);
  const label = `${r.title}, ${fmtDate(d)}`;
  return big
    ? `<button class="tick tick--big" data-tick="${r.date}" aria-pressed="${done}" aria-label="${done ? 'Done' : 'Mark as done'}: ${esc(label)}">${TICK_SVG}<span class="tick__label" aria-hidden="true">${done ? 'Done!' : 'Mark as done'}</span></button>`
    : `<button class="tick" data-tick="${r.date}" aria-pressed="${done}" aria-label="${done ? 'Done' : 'Mark as done'}: ${esc(label)}">${TICK_SVG}</button>`;
}

const NOTE = {
  easy: n => `Nice and easy today, ${n}. Chatting pace.`,
  long: n => `Big one today, ${n}. Slow and steady.`,
  speed: n => `Time to get quick, ${n}!`,
  tempo: n => `Comfortably hard today, ${n}. You’ve got this.`,
  parkrun: n => `Enjoy parkrun, ${n}, and thank a marshal!`,
  race: n => `This is it, ${n}. You’ve done the work.`,
};
const DONE_MSG = [n => `Nice one, ${n}!`, n => `Another one in the bag, ${n}.`, n => `Brilliant work, ${n}.`, n => `That’s the way, ${n}!`, n => `Ticked off. Proud of you, ${n}.`];

function renderToday(now) {
  const p = state.profile, nm = first(p.name), el = $('#today');
  const race = parseISO(p.date);
  if (now.t > race) {
    el.style.setProperty('--t', 'var(--pink)');
    const runs = allRuns(), done = runs.filter(r => state.done[r.date]).length;
    el.innerHTML = `<div class="today__body"><p class="today__kicker caps">After the race</p><h2>You did it, ${nm}!</h2>
      <p class="today__purpose">${done} of ${runs.length} runs done over ${plan.N} weeks. Whatever the clock said, you turned up week after week, and that’s what makes a runner.</p>
      <p class="hand-note">Take a few easy days. You’ve earned them.</p>
      <div class="today__actions"><button class="cta caps" data-act="another">${LOZ}Plan your next race${ARROW}</button></div></div>`;
    return;
  }
  const r = now.todayRun;
  const show = r && !(state.done[r.date] && now.next) ? r : null;
  if (r && state.done[r.date]) {
    // Done today: celebrate, then show what's next
    const nx = now.next;
    el.style.setProperty('--t', 'var(--go)');
    el.className = 'card today';
    el.innerHTML = `<div class="today__body"><p class="today__kicker caps"><span>Today · ${fmtDate(now.t)}</span></p>
      <div class="today__done">${CHECK}<p><b>${esc(r.title)}</b> done. ${pick(DONE_MSG, seedOf(r.date))(nm)}</p></div>
      ${nx ? nextBlock(nx, now) : ''}
      <div class="today__actions"><span></span>${tickHTML(r, true)}</div></div>`;
    return;
  }
  const run = show || now.next;
  if (!run) { el.innerHTML = `<div class="today__body"><h2>All done, ${nm}.</h2></div>`; return; }
  const isToday = run.date === now.ti, d = parseISO(run.date), days = diffDays(now.t, d);
  el.className = `card today t-${run.cat}`;
  el.style.removeProperty('--t');
  const kick = isToday ? `Today · ${fmtDate(d)}` : `${days === 1 ? 'Tomorrow' : 'Next run'} · ${fmtDate(d)}`;
  const restLine = !isToday ? `<p class="nudge-line">${days === 1 ? `Rest day today, ${nm}. Recovery is when your body gets stronger.` : `No run today, ${nm}. Rest up: your next one is ${DOW[dowMon(d)]}.`}</p>` : '';
  const missLine = now.missed.length ? `<p class="nudge-line">Missed ${now.missed.length === 1 ? 'a run' : now.missed.length + ' runs'} recently? No stress. Don’t try to catch up; just carry on from here. ${now.missed.length === 1 ? 'If you did it, tick it off below.' : ''}</p>` : '';
  el.innerHTML = `<div class="today__body">
    <p class="today__kicker caps"><span>${kick}</span><span class="chip">${CHIP_NAME[run.cat]}</span></p>
    ${restLine}
    <h2>${esc(run.title)}</h2>
    ${factsHTML(run)}
    <p class="today__purpose"><b>Purpose: ${esc(run.purpose)}.</b> ${WHY[run.kind](p.distance)}</p>
    ${run.buggy ? '<p><span class="pill caps">With the buggy</span></p>' : ''}

    <details class="today__more"><summary class="link-btn"><span>What to do, step by step</span></summary><div style="padding-top:.75rem">${detailHTML(run)}</div></details>
    ${missLine}
    <div class="today__actions"><span class="muted caps">${isToday ? 'Done it?' : 'Ran it early?'}</span>${tickHTML(run, true)}</div>
  </div>`;
}
function nextBlock(nx, now) {
  const F = fmt(state.units), d = parseISO(nx.date), days = diffDays(now.t, d);
  return `<div><p class="caps muted">Up next · ${days === 1 ? 'Tomorrow' : fmtDate(d)}</p><p style="font-size:1.25rem;margin-top:.2rem"><span class="chip t-${nx.cat} caps" style="margin-right:.4rem">${CHIP_NAME[nx.cat]}</span>${esc(nx.title)}, ${F.dist(nx.km, nx.exact)}</p></div>`;

function renderPaces(now) {
  const F = fmt(state.units), wk = plan.weeks[Math.max(0, now.wkIdx)] || plan.weeks[0];
  const p = state.profile;
  $('#paces-lede').innerHTML = `These are your paces for ${now.wkIdx >= 0 ? 'this week' : 'the first week'}. They’ll get a little quicker as you get fitter. ${T('pace', 'What’s a pace?')}`;

    const P = PACE[k], v = k === 'race' ? F.pace(p.goal / DIST[p.distance].km) : F.range(wk.Z[k]);
    return `<li><span class="paces__name">${T(P.term, esc(P.name))}</span><span class="paces__val">${v}</span><span class="paces__feel">${P.feel}</span></li>`;
  });
  $('#paces').innerHTML = rows.join('');
}

function renderWeeks(now) {
  const F = fmt(state.units), p = state.profile, nm = first(p.name);
  const D = DIST[p.distance];
  let lede = `${plan.N} week${plan.N === 1 ? '' : 's'}, ${p.runs} runs a week${p.parkrun ? ' including parkrun' : ''}. Tap a run for the details, and tap the circle when it’s done.`;
  if (plan.short) lede += ` Time is tight, so your longest run will reach ${F.dist(plan.peakEff)} rather than the usual ${F.dist(plan.peak)}. That’s fine: you can still get round strongly.`;

    const allDone = w.runs.length && doneN === w.runs.length;

    if (allDone && w.runs.length) intro = `<p class="wk__intro"><b>Week ${w.n} complete. Brilliant, ${nm}!</b></p>` + (w.firstOfPhase ? '' : '');
    return `<li class="wk ${open ? 'is-open' : ''} ${isNow ? 'is-now' : ''} ${past ? 'is-past' : ''}" id="wk-${w.n}">

        <span class="wk__sub caps">${PHASE[w.phase].name} · ${fmtRangeDates(w.start, w.end)}</span>
        <span class="wk__dots" aria-hidden="true">${w.runs.map(r => `<i class="${state.done[r.date] ? 'done' : ''}"></i>`).join('')}</span>
        <span class="wk__side"><span class="wk__km"><b>${F.dist(w.km).replace(/ (km|mi)$/, '')}</b><span class="caps">${F.unit} · ${doneN}/${w.runs.length}</span></span><span class="wk__chev" aria-hidden="true"></span></span>
      </button>
      <div class="wk__body" id="wkb-${w.n}" ${open ? '' : 'hidden'}>${open ? intro + `<ul class="runs">${w.runs.map(r => runRow(r, now)).join('') || '<li class="run"><p class="run__meta" style="padding:1rem 0">No runs this week.</p></li>'}</ul>` : ''}</div>
    </li>`;
  }).join('');
}
function runRow(r, now) {
  const F = fmt(state.units), d = parseISO(r.date), done = !!state.done[r.date];
  const isToday = r.date === now.ti, missed = !done && r.date < now.ti, open = openRuns.has(r.date);

  return `<li class="run t-${r.cat} ${done ? 'is-done' : ''} ${isToday ? 'is-today' : ''} ${missed ? 'is-missed' : ''}">

        <span class="run__main">
          <span class="chip caps">${CHIP_NAME[r.cat]}${isToday ? ' <span class="run__today">· Today</span>' : ''}</span>
          <span class="run__title">${esc(r.title)}</span>
          <span class="run__meta">${F.dist(r.km, r.exact)} · ${pace}${r.kind === 'race' ? ` · ${hms(state.profile.goal)}` : ''}</span>
          ${r.buggy ? '<span class="run__flag"><span class="pill caps">Buggy</span></span>' : ''}
        </span>
      </button>
      ${tickHTML(r)}
    </div>
    <div class="run__detail" id="rd-${r.date}" ${open ? '' : 'hidden'}>${open ? `<p class="run__meta" style="margin-bottom:.8rem"><b>Purpose: ${esc(r.purpose)}</b></p>` + detailHTML(r) : ''}</div>
  </li>`;
}

/* Tune panel: built once so sliders keep working while you drag them */

  $('#tune').innerHTML = `

      <input class="range" type="range" id="t-longest" data-tune="longest" min="0" max="${longestMax(p.distance)}" step=".5" value="${p.longest}">

    <div class="slider"><div class="slider__top"><label class="slider__label caps" for="t-pb5">5K PB</label><output class="slider__value" id="to-pb5">${p.pbs['5k'] ? hms(p.pbs['5k']) : 'None yet'}</output></div>
      <input class="range" type="range" id="t-pb5" data-tune="pb5" min="900" max="3000" step="5" value="${p.pbs['5k'] || 3000}" aria-valuetext="${p.pbs['5k'] ? hms(p.pbs['5k']) : 'None yet'}">
      <p class="field__hint">Run a new best at parkrun? Slide to your new time and every pace updates. Slide all the way right for “none yet”.</p></div>
    <label class="switch"><span class="switch__text"><span class="switch__title">Saturday parkrun</span><span class="switch__sub">Counts as one of your weekly runs</span></span><input type="checkbox" role="switch" data-tune="parkrun" ${p.parkrun ? 'checked' : ''}><span class="switch__track" aria-hidden="true"></span></label>
    <div class="tune__foot"><button class="link-btn" data-act="edit"><span>Edit all your details</span></button></div>`;
  $$('#tune .range').forEach(setFill);
  syncTune();
}
function syncTune() {
  const p = state.profile;
  const v = verdict(p, plan ? plan.N : weeksUntil(p.date, state.start));
  const el = $('#t-verdict'); if (el) el.innerHTML = `<span class="${v.cls} caps">${v.label}</span><p>${v.text}</p>`;
}
let tuneRaf;
function onTune(e) {
  const t = e.target, k = t.dataset && t.dataset.tune, p = state.profile;
  if (t.hasAttribute && t.hasAttribute('data-buggy-run')) return;   // handled on change below
  if (!k) return;
  if (t.classList.contains('range')) setFill(t);
  if (k === 'goal') { p.goal = +t.value; $('#to-goal').textContent = hms(p.goal); t.setAttribute('aria-valuetext', hms(p.goal)); }
  if (k === 'runs') { p.runs = +t.value; $('#to-runs').textContent = p.runs; $('#t-runs-hint').textContent = runsHint(p); }
  if (k === 'longest') { p.longest = +t.value; $('#to-longest').textContent = longestLabel(p.longest); }
  if (k === 'pb5') { const v = +t.value; if (v >= 3000) delete p.pbs['5k']; else p.pbs['5k'] = v; const s = p.pbs['5k'] ? hms(v) : 'None yet'; $('#to-pb5').textContent = s; t.setAttribute('aria-valuetext', s); }
  if (k === 'parkrun') p.parkrun = t.checked;
  if (k === 'runs' || k === 'parkrun') { const slots = SLOTS[!!p.parkrun][p.runs]; p.buggyDays = (p.buggyDays || []).filter(x => slots.some(s => s[0] === x)); }
  save();
  cancelAnimationFrame(tuneRaf);
  tuneRaf = requestAnimationFrame(() => { const now = (regen(), nowInfo()); renderHero(now); renderToday(now); renderPaces(now); renderWeeks(now); syncTune(); });
}

function renderSettings() {
  const p = state.profile;
  $('#settings').innerHTML = `<div class="wrap">
    <h2>Your plan is saved on this device</h2>
    <p>Come back any time on this phone or computer and it’ll be here, ticks and all. Clearing your browser data will remove it, so keep a backup link somewhere safe (like a note or an email to yourself).</p>
    <div class="settings__grid">
      <div class="field"><span class="field__label caps" id="l-units">Distances in</span>
        <div class="seg" role="radiogroup" aria-labelledby="l-units">
          <label><input type="radio" name="units" value="km" ${state.units !== 'mi' ? 'checked' : ''}><span>Kilometres</span></label>
          <label><input type="radio" name="units" value="mi" ${state.units === 'mi' ? 'checked' : ''}><span>Miles</span></label>
        </div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-start">
        <button class="link-btn" data-act="backup"><span>Back up your plan</span></button>
        <button class="link-btn" data-act="edit"><span>Edit your details</span></button>
        <button class="link-btn settings__danger" data-act="reset"><span>Start a new plan</span></button>
      </div>
    </div>
    <p class="settings__meta">Plans follow widely used training principles: mostly easy running, a long run that builds gradually, cutback weeks and a taper. They’re a guide, not medical advice. If something hurts, rest, and see a professional if it doesn’t settle. · <a href="/">tedw.co.uk</a></p>
  </div>`;
}

/* ---------- Clicks ---------- */
app.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act;
    if (act === 'begin') { draft = newDraft(); step = 0; goalTouched = false; editing = false; view = 'setup'; renderSetup.focus = false; render(); window.scrollTo(0, 0); setTimeout(() => $('#f-name') && $('#f-name').focus(), 50); }
    if (act === 'back') { readStep(false); step = Math.max(0, step - 1); renderSetup(); window.scrollTo(0, 0); }
    if (act === 'edit') { draft = newDraft(); step = 0; goalTouched = true; editing = true; view = 'setup'; render(); window.scrollTo(0, 0); }
    if (act === 'cancel-edit') { editing = false; view = 'plan'; render(); window.scrollTo(0, 0); }
    if (act === 'reset') {
      if (confirm('Start a new plan? Your current plan and ticks will be deleted from this device.')) {
        const name = state.profile && state.profile.name;
        state = { v: 1, profile: null, start: null, done: {}, buggy: {}, units: state.units };
        save(true); draft = newDraft(); draft.name = name || ''; step = 0; goalTouched = false; editing = false; view = 'setup'; render(); window.scrollTo(0, 0);
      }
    }
    if (act === 'another') {
      const name = state.profile.name;
      state = { v: 1, profile: null, start: null, done: {}, buggy: {}, units: state.units };
      draft = newDraft(); draft.name = name; step = 1; goalTouched = false; editing = false; view = 'setup'; render(); window.scrollTo(0, 0);
    }
    if (act === 'backup') backup();
    return;
  }
  const nudge = e.target.closest('[data-nudge],[data-tnudge]');
  if (nudge) {
    const id = nudge.dataset.nudge || nudge.dataset.tnudge;
    const r = nudge.dataset.nudge ? $(`#r-${id}`) : $(`#t-${id}`);
    r.value = +r.value + (+nudge.dataset.dir) * (+r.step);
    r.dispatchEvent(new Event('input', { bubbles: true }));
    return;
  }
  const tk = e.target.closest('[data-tick]');
  if (tk) { toggleDone(tk.dataset.tick, tk); return; }
  const wh = e.target.closest('[data-week]');
  if (wh) {
    const i = +wh.dataset.week;
    openWeeks.has(i) ? openWeeks.delete(i) : openWeeks.add(i);
    const now = nowInfo(); renderWeeks(now);
    const b = $(`[data-week="${i}"]`); b && b.focus({ preventScroll: true });
    return;
  }
  const rt = e.target.closest('[data-run]');
  if (rt) {
    const d = rt.dataset.run;
    openRuns.has(d) ? openRuns.delete(d) : openRuns.add(d);
    const now = nowInfo(); renderWeeks(now);
    const b = $(`[data-run="${d}"]`); b && b.focus({ preventScroll: true });
  }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (view !== 'plan' || !t.hasAttribute('data-buggy-run')) return;
  state.buggy[t.dataset.buggyRun] = t.checked;
  save();
  const date = t.dataset.buggyRun;
  const now = (regen(), nowInfo()); renderToday(now); renderWeeks(now);
  const sw = $(`#weeks [data-buggy-run="${date}"]`) || $(`#today [data-buggy-run="${date}"]`); sw && sw.focus({ preventScroll: true });
  toast(t.checked ? `Buggy run noted. Paces eased off, ${first(state.profile.name)}.` : 'Solo run. Paces back to normal.');
});

function toggleDone(date, btn) {
  const p = state.profile, nm = first(p.name);
  const was = !!state.done[date];
  if (was) delete state.done[date]; else state.done[date] = 1;
  save();
  const inToday = btn && btn.closest('#today');
  const now = nowInfo();
  renderHero(now); renderToday(now); renderWeeks(now);
  const again = inToday ? $(`#today [data-tick]`) : $(`#weeks [data-tick="${date}"]`);
  again && again.focus({ preventScroll: true });
  if (was) return;
  const r = allRuns().find(x => x.date === date);
  const wk = plan.weeks.find(w => w.runs.includes(r));
  const wkDone = wk.runs.every(x => state.done[x.date]);
  const left = allRuns().filter(x => !state.done[x.date]).length;
  let msg = pick(DONE_MSG, seedOf(date))(nm);
  if (r.kind === 'race') msg = `You did it, ${nm}! What a moment.`;
  else if (r.newLongest) msg = `That’s your longest run yet, ${nm}. Huge!`;
  else if (wkDone) msg = `Week ${wk.n} done, ${nm}! ${left ? 'On to the next.' : ''}`;
  else if (r.cat === 'speed') msg = `Speed session done, ${nm}. Legs getting quicker!`;
  toast(msg);
}

function backup() {
  const url = `${location.origin}${location.pathname}#plan=${encode(state)}`;
  const nm = first(state.profile.name);
  if (navigator.share) { navigator.share({ title: `${nm}’s run plan`, text: 'My running plan backup. Open this link to restore it.', url }).catch(() => {}); return; }
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Backup link copied. Paste it somewhere safe.'), () => prompt('Copy this link and keep it somewhere safe:', url));
  else prompt('Copy this link and keep it somewhere safe:', url);
}

/* Restore from a backup link */
function restoreFromHash() {
  const m = location.hash.match(/^#plan=([\w-]+)/);
  if (!m) return;
  try {
    const s = decode(m[1]);
    if (s && s.v === 1 && s.profile) {
      if (!state.profile || confirm(`Restore ${s.profile.name ? s.profile.name + '’s' : 'this'} plan from the link? It will replace the plan on this device.`)) {
        state = s; save(true); view = 'plan';
      }
    }
  } catch (err) { /* bad link: ignore */ }
  history.replaceState(null, '', location.pathname);
}

/* Keep "today" right if the page is left open overnight */
document.addEventListener('visibilitychange', () => { if (!document.hidden && view === 'plan' && lastNow !== iso(today())) updatePlan(); });

restoreFromHash();
render();
window.RunPlan = { generate, estimate, verdict, parseTime, DIST, zones, defaultGoal };
})();
</script>
</body>
</html>

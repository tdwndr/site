/* ---------- Plan tab ---------- */
function miniRing(d, t) {
  if (t && d === t) return `<span class="mring mring--done" role="img" aria-label="All ${t} runs done">${ic('check')}</span>`;
  const C = 2 * Math.PI * 18, f = t ? d / t : 0;
  return `<span class="mring" role="img" aria-label="${d} of ${t} runs done"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="mring__bg" cx="22" cy="22" r="18"/><circle class="mring__fg" cx="22" cy="22" r="18" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - f)}"/></svg><span aria-hidden="true">${d}/${t}</span></span>`;
}
const longOf = w => { const l = w.runs.find(r => r.cat === 'long' || r.kind === 'race'); return l ? l.km : 0; };
let chartMode = state.chartView === 'total' ? 'total' : 'phase';
const cumulative = () => {
  let p = 0, d = 0;
  return plan.weeks.map(w => { p += w.km; d += w.runs.filter(isDone).reduce((s, r) => s + r.km, 0); return { plan: p, done: d }; });
};
function chartReadout(i, now) {
  const F = fmt(state.units), w = plan.weeks[i], isNow = w.i === now.wkIdx;
  if (chartMode === 'total') {
    const c = cumulative()[i], future = now.t < w.start;
    return `<b>By the end of week ${w.n}${isNow ? ' (this week)' : ''}</b><span><strong>${F.dist(c.plan)}</strong> planned in total</span>${future ? '' : `<span><strong>${F.dist(c.done)}</strong> run so far</span>`}`;
  }
  const doneKm = w.runs.filter(isDone).reduce((s, r) => s + r.km, 0);
  return `<b>Week ${w.n}${isNow ? ' (this week)' : ''}</b><span>${PHASE[w.phase].name}${w.cut ? ' · deload' : ''} · ${fmtRangeDates(w.start, w.end)}</span>
    ${w.runs.some(r => r.kind === 'race') ? `<span><strong>${F.dist(w.km - longOf(w))}</strong> of runs + the <strong>${F.dist(longOf(w), true)}</strong> race</span>` : `<span><strong>${F.dist(w.km)}</strong> in total${doneKm ? ` · ${F.dist(doneKm)} done` : ''}</span>`}<span>Long run <strong>${F.dist(longOf(w), w.runs.some(r => r.kind === 'race'))}</strong></span>`;
}
const niceStep = v => [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(x => x >= v) || 1000;
const chartTop = max => { const st = niceStep(max / 4); return [st, Math.ceil(max / st) * st]; };
function chartBody(now) {
  const F = fmt(state.units), W = plan.weeks, n = W.length, toU = km => F.mi ? km / MI : km;
  const sel = chartSel != null && W[chartSel] ? chartSel : Math.max(0, now.wkIdx);
  const cum = cumulative();
  const max = chartMode === 'total' ? Math.max(toU(cum[n - 1].plan), 1) : Math.max(...W.map(w => toU(w.km)), 1);
  const [step, top] = chartTop(max);
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  const phases = []; W.forEach(w => { const l = phases[phases.length - 1]; if (l && l.p === w.phase) l.c++; else phases.push({ p: w.phase, c: 1 }); });
  const grid = `<div class="chart__grid" aria-hidden="true">${ticks.map(v => `<div style="bottom:${v / top * 100}%"><span>${v}</span></div>`).join('')}</div>`;
  const label = (w, i) => `Week ${w.n}: ${chartMode === 'total' ? `${F.dist(cum[i].plan)} planned in total` : `${PHASE[w.phase].name}, ${F.dist(w.km)}`}`;
  let plot;
  if (chartMode === 'total') {
    // Cumulative distance: planned (light line) and run so far (filled), one km axis
    const x = i => (i + 1) / n * 100, y = v => 100 - toU(v) / top * 100;
    const planPts = ['0,100', ...cum.map((c, i) => `${x(i)},${y(c.plan)}`)].join(' ');
    const last = now.wkIdx >= 0 ? now.wkIdx : (now.t < W[0].start ? -1 : n - 1);
    const runPts = ['0,100', ...cum.slice(0, last + 1).map((c, i) => `${x(i)},${y(c.done)}`)];
    const area = last >= 0 ? `<path class="run" d="M${runPts.join(' L')} L${x(last)},100 Z"/><polyline class="runline" points="${runPts.join(' ')}"/>` : '';
    const pinV = now.t < W[sel].start ? cum[sel].plan : cum[sel].done;
    plot = `${grid}<svg class="chart__area" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline class="plan" points="${planPts}"/>${area}</svg>
      <span class="chart__end" style="bottom:${100 - y(cum[n - 1].plan)}%">${F.dist(cum[n - 1].plan)}</span>
      <span class="chart__cross" id="chart-cross" style="left:${x(sel)}%"></span><span class="chart__pin" id="chart-pin" style="left:${x(sel)}%;bottom:${100 - y(pinV)}%"></span>
      <div class="chart__bars">${W.map((w, i) => `<button class="bar-col bar-col--hit ${i === sel ? 'is-sel' : ''}" data-bar="${i}" aria-label="${label(w, i)}" aria-pressed="${i === sel}"></button>`).join('')}</div>`;
  } else {
    // Weekly distance coloured by training phase; solid = done
    plot = `${grid}<div class="chart__bars">${W.map((w, i) => {
      const h = toU(w.km) / top * 100, dk = w.runs.filter(isDone).reduce((s, r) => s + r.km, 0), dh = w.km ? dk / w.km * 100 : 0;
      const rk = (w.runs.find(r => r.kind === 'race') || {}).km || 0, rh = w.km ? rk / w.km * 100 : 0;
      const mark = i === now.wkIdx ? '<span class="bar-col__mark">Now</span>' : i === n - 1 ? `<span class="bar-col__mark">${ic('race')}</span>` : '';
      return `<button class="bar-col p-${w.phase} ${i === sel ? 'is-sel' : ''}" data-bar="${i}" aria-label="${label(w, i)}${w.cut ? ', deload week' : ''}" aria-pressed="${i === sel}"><span class="bar" style="height:${h}%"><span class="bar__done" style="height:${dh}%"></span>${rh ? `<span class="bar__race" style="height:${rh}%"></span>` : ''}</span>${mark}</button>`;

  }
  const legend = chartMode === 'total'

    : phases.map(x => `<span class="p-${x.p}"><i class="lg-bar"></i>${PHASE[x.p].name}</span>`).join('') + `<span><i class="lg-race"></i>Race</span><span><i class="lg-bar lg-bar--soft" style="--c:var(--ink-3)"></i>Lighter = still to run</span>`;
  return `<div class="chart"><div class="chart__plot">${plot}</div>
      <div class="chart__phases" aria-hidden="true">${phases.map(x => `<span class="p-${x.p}" style="flex:${x.c}">${PHASE[x.p].name}</span>`).join('')}</div></div>
    <div class="chart__readout" id="chart-readout" aria-live="polite">${chartReadout(sel, now)}</div>
    <div class="legend2">${legend}</div>
    <details class="chart__table"><summary><span class="t-show">Show as a table</span><span class="t-hide">Hide table</span></summary>
      <table><thead><tr><th scope="col">Week</th><th scope="col">Phase</th><th scope="col">Week total</th><th scope="col">Long run</th><th scope="col">Running total</th></tr></thead>
      <tbody>${W.map((w, i) => `<tr><td>${w.n}${w.cut ? ' (deload)' : ''}</td><td>${PHASE[w.phase].name}</td><td>${F.dist(w.km)}</td><td>${F.dist(longOf(w))}</td><td>${F.dist(cum[i].plan)}</td></tr>`).join('')}</tbody></table>
    </details>`;
}
const chartSubText = () => { const F = fmt(state.units); return chartMode === 'total' ? `Total distance in ${F.unit}, building up to race day. Tap a week for details.` : `Weekly distance in ${F.unit}, coloured by phase. Spot the deload dips and the taper.`; };
function chartHTML(now) {

    ${r.kind !== 'race' ? `<section class="sheet__sec"><h3 class="eyebrow sheet__h">Day</h3>${moverHTML(r)}</section>` : ''}
    ${r.canBuggy ? `<div class="card list" style="margin-top:14px"><label class="row k-accent"><span class="tile">${ic('buggy')}</span><span class="row__label">With the buggy<small>Eases the target pace by about 7%</small></span><span class="sw"><input type="checkbox" role="switch" data-buggy-run="${r.id}" ${r.buggy ? 'checked' : ''}><span class="sw__t"></span></span></label></div>`
      : (buggyUser && r.cat === 'speed' && !r.note ? `<div class="callout k-accent">${ic('buggy')}<p>${BUGGY_NOTE.blocked}</p></div>` : '')}
  </div>
  <div class="sheet__foot">${tickBtn(r, 'btn--block')}</div>`;
  dlg.querySelector('.sheet__scroll').scrollTop = top;
}

/* ---------- Actions ---------- */
function toggleDone(id, btn) {
  const p = state.profile, nm = first(p.name), was = !!state.done[id];
  const where = btn && btn.closest('dialog, [data-screen]'), whereSel = where ? `#${where.id}` : null, hadFocus = document.activeElement === btn;
  if (!was) burst(btn.querySelector('.check__c') || btn, `var(--c-${(runById(id) || {}).cat || 'easy'})`);
  if (was) delete state.done[id]; else state.done[id] = snapshotOf(runById(id));
  save(); haptic();
  refresh();
  if (hadFocus && whereSel) { const again = $(`${whereSel} [data-tick="${id}"]`); again && again.focus({ preventScroll: true }); }
  if (!was && whereSel === '#run-sheet') setTimeout(() => closeSheet($('#run-sheet')), 450);
  if (was) return;
  const r = runById(id), wk = weekOf(r), wkDone = wk.runs.every(isDone);
  let msg = pick(DONE_MSG, seedOf(id))(nm), icon = 'star';
  if (r.kind === 'race') { msg = `You did it, ${nm}! What a moment.`; icon = 'trophy'; confetti(); }
  else if (r.newLongest) { msg = `Your longest run yet, ${nm}. Huge!`; icon = 'trophy'; }
  else if (wkDone) { msg = `Week ${wk.n} done, ${nm}! Brilliant.`; icon = 'trophy'; }
  else if (r.cat === 'speed') { msg = `Speed session done, ${nm}. Legs getting quicker!`; icon = 'speed'; }
  toast(msg, icon);
}
function moveRun(id, toISO) {
  if (toISO === id) delete state.moves[id]; else state.moves[id] = toISO;
  save(); haptic(); regen(); refresh();
  const r = runById(id);
  toast(r && r.date === toISO ? (toISO === id ? 'Back on its usual day.' : `Moved to ${DOW[dowMon(parseISO(toISO))]}, ${first(state.profile.name)}.`) : 'That day isn’t free.', 'move');
  const b = $(`#run-sheet [data-move="${toISO}"]`); b && b.focus({ preventScroll: true });
  if (Object.keys(state.moves).length <= 1) renderAdjust();
}

function backup() {
  const url = `${location.origin}${location.pathname}#plan=${encode(state)}`, nm = first(state.profile.name);
  if (navigator.share) { navigator.share({ title: `${nm}’s run plan`, text: 'My running plan backup. Open this link to restore it.', url }).catch(() => {}); return; }
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Backup link copied. Paste it somewhere safe.', 'check'), () => prompt('Copy this link and keep it somewhere safe:', url));
  else prompt('Copy this link and keep it somewhere safe:', url);
}
function freshState() { return { v: DATA_VERSION, profile: null, start: null, done: {}, buggy: {}, moves: {}, units: state.units }; }
function startSetup(opts) {
  draft = newDraft(); step = opts.step || 0; goalTouched = !!opts.editing; editing = !!opts.editing;
  if (opts.name) draft.name = opts.name;
  view = 'setup'; renderSetup.focus = false; render(); window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act;
    if (act === 'begin') { startSetup({}); setTimeout(() => { const f = $('#f-name'); f && f.focus(); }, 60); }
    if (act === 'to-intro') { view = 'intro'; render(); }
    if (act === 'back') { readStep(false); step = Math.max(0, step - 1); renderSetup(); window.scrollTo(0, 0); }
    if (act === 'edit') startSetup({ editing: true });
    if (act === 'cancel-edit') { editing = false; view = 'plan'; render(); window.scrollTo(0, 0); }
    if (act === 'reset' && confirm('Start a new plan? Your current plan and ticks will be deleted from this device.')) {
      const name = state.profile && state.profile.name; state = freshState(); save(true); startSetup({ name });
    }
    if (act === 'reset-moves') { state.moves = {}; save(); regen(); refresh(); renderAdjust(); toast('All runs are back on their suggested days.', 'move'); }
    if (act === 'another') { const name = state.profile.name; state = freshState(); save(true); startSetup({ name, step: 1 }); }
    if (act === 'backup') backup();
    if (act === 'method') openMethod();
    return;
  }
  const nudge = e.target.closest('[data-nudge]');
  if (nudge) {
    const r = $(`#${nudge.dataset.nudge}`);
    r.value = +r.value + (+nudge.dataset.dir) * (+r.step);
    r.dispatchEvent(new Event('input', { bubbles: true }));
    haptic();
    return;
  }
  const ri = e.target.closest('[data-race-item]');
  if (ri) {
    state.raceList = state.raceList || {};
    const i = ri.dataset.raceItem, on = !state.raceList[i];
    if (on) state.raceList[i] = 1; else delete state.raceList[i];
    ri.setAttribute('aria-pressed', on); save(); haptic();
    if (on) burst(ri.querySelector('.box'), '#fff');
    return;
  }
  const tk = e.target.closest('[data-tick]');
  if (tk) { toggleDone(tk.dataset.tick, tk); return; }
  const mv = e.target.closest('[data-move]');
  if (mv) { if (mv.getAttribute('aria-checked') !== 'true') moveRun(sheetId, mv.dataset.move); return; }
  const um = e.target.closest('[data-unmove]');
  if (um) { moveRun(um.dataset.unmove, um.dataset.unmove); return; }
  const op = e.target.closest('[data-open]');
  if (op) { openRun(op.dataset.open); return; }
  const tb = e.target.closest('[data-tab]');
  if (tb) { setTab(tb.dataset.tab); return; }
  const go = e.target.closest('[data-goto]');
  if (go) { setTab(go.dataset.goto); return; }
  const bar = e.target.closest('[data-bar]');
  if (bar) { selectBar(+bar.dataset.bar); return; }
  const wh = e.target.closest('[data-week]');
  if (wh) {
    const i = +wh.dataset.week;
    openWeeks.has(i) ? openWeeks.delete(i) : openWeeks.add(i);
    const sec = wh.closest('.week'), open = openWeeks.has(i);
    sec.classList.toggle('is-open', open);
    wh.setAttribute('aria-expanded', open);
    sec.querySelector('.week__body').hidden = !open;
  }
});
function selectBar(i) {
  if (chartSel === i && document.querySelector(`[data-bar="${i}"].is-sel`)) return;   // no re-render loop while hovering
  chartSel = i;
  const now = nowInfo();
  $$('[data-bar]').forEach(b => { const on = +b.dataset.bar === i; b.classList.toggle('is-sel', on); b.setAttribute('aria-pressed', on); });
  const ro = $('#chart-readout'); if (ro) ro.innerHTML = chartReadout(i, now);
  if (chartMode === 'total') {
    const W = plan.weeks, n = W.length, c = cumulative(), F = fmt(state.units), toU = km => F.mi ? km / MI : km;
    const top = chartTop(Math.max(toU(c[n - 1].plan), 1))[1];
    const v = now.t < W[i].start ? c[i].plan : c[i].done, x = (i + 1) / n * 100;
    const cr = $('#chart-cross'), pin = $('#chart-pin');
    if (cr) cr.style.left = `${x}%`;
    if (pin) { pin.style.left = `${x}%`; pin.style.bottom = `${toU(v) / top * 100}%`; }
  }
}
document.addEventListener('pointerover', e => { const b = e.target.closest && e.target.closest('[data-bar]'); if (b && e.pointerType === 'mouse') selectBar(+b.dataset.bar); });
document.addEventListener('focusin', e => { const b = e.target.closest && e.target.closest('[data-bar]'); if (b) selectBar(+b.dataset.bar); });

document.addEventListener('input', e => {
  const t = e.target;
  if (view === 'setup' && draft && t.closest('#setup')) { onSetupInput(t); return; }
  if (view === 'plan' && t.dataset.tune) onTune(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (view !== 'plan') return;
  if (t.name === 'units') { state.units = t.value; save(); renderAdjust(); refresh(); return; }
  if (t.name === 'chart-view') {
    chartMode = t.value; state.chartView = t.value; save();
    $('#chart-sub').textContent = chartSubText();
    $('#chart-body').innerHTML = chartBody(nowInfo());
    return;
  }
  if (t.hasAttribute('data-buggy-run')) {
    state.buggy[t.dataset.buggyRun] = t.checked;
    save(); haptic(); regen(); refresh();
    const sw = $(`#run-sheet [data-buggy-run="${t.dataset.buggyRun}"]`); sw && sw.focus({ preventScroll: true });
    toast(t.checked ? `Buggy run noted. Paces eased off, ${first(state.profile.name)}.` : 'Solo run. Paces back to normal.', t.checked ? 'buggy' : 'check');
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'setup') return;
  e.preventDefault();
  if (!readStep(true)) return;
  if (step < STEPS - 1) { step++; renderSetup(); window.scrollTo(0, 0); }
  else finishSetup();
});

/* Restore from a backup link */
function restoreFromHash() {
  const m = location.hash.match(/^#plan=([\w-]+)/);
  if (!m) return;
  try {
    const s = decode(m[1]);
    if (migrate(s) && s.profile && (!state.profile || confirm(`Restore ${s.profile.name ? s.profile.name + '’s' : 'this'} plan from the link? It will replace the plan on this device.`))) {
      state = s; if (!state.moves) state.moves = {}; save(true); view = 'plan';
    }
  } catch (err) { /* bad link: ignore */ }
  history.replaceState(null, '', location.pathname);
}

/* Keep "today" right if the app is left open overnight */
document.addEventListener('visibilitychange', () => { if (!document.hidden && view === 'plan' && lastNow !== iso(today())) refresh(); });

restoreFromHash();
render();
window.RunPlan = { generate, estimate, verdict, parseTime, DIST, zones, defaultGoal };
})();
</script>
</body>
